      else inp = `<input name="${f.k}" type="${f.type || 'text'}" value="${esc(v)}" ${f.type === 'number' ? `step="any" inputmode="decimal"` : ''} ${f.min != null ? `min="${f.min}"` : ''} ${f.max != null ? `max="${f.max}"` : ''} ${req} ${dis} ${f.ph ? `placeholder="${esc(f.ph)}"` : ''}>`;

const slug = t => t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 30) || 'sec';
function applyCompact() {
  const on = compact(), root = mainView;
  document.body.classList.toggle('compact', on);
  root.querySelectorAll('.cmp-hid').forEach(e => e.classList.remove('cmp-hid'));
  root.querySelectorAll('.secbtn[data-open], .foldbtn').forEach(e => e.remove());
  if (!on) return;
  // secciones: bloques marcados y tarjetas con título que no son lo principal de la pantalla
  const secs = [...root.querySelectorAll('[data-sec]'), ...[...root.querySelectorAll('.card')].filter(c => !c.dataset.main && !c.dataset.sec && c.querySelector(':scope > h3'))];
  const used = new Set();
  for (const el of secs.splice(0)) if (getComputedStyle(el).display !== 'none') secs.push(el);   // las ocultas (p. ej. de oficina) no cuentan
  for (const el of secs) {
    if (!el.dataset.sec || el.dataset.auto) { let k = slug(secTitle(el)), n = 2; while (used.has(k)) k = slug(secTitle(el)) + '-' + n++; el.dataset.sec = k; el.dataset.auto = '1'; }
    used.add(el.dataset.sec);

  const cur = secParam(), open = cur && root.querySelector(`[data-sec="${CSS.escape(cur)}"]`);
  for (const el of secs) {
    if (open && el.contains(open)) continue;   // la abierta y sus contenedores no se pliegan
    const sum = el.dataset.sumfn === 'orient' ? orientText(readOrient()) : el.dataset.sumfn === 'free' ? freeSum() : (el.dataset.sum || '');
    el.insertAdjacentHTML('beforebegin', `<button type="button" class="secbtn" data-open="${esc(el.dataset.sec)}"><span class="sm2"><span>${esc(secTitle(el))}</span>${sum ? `<span class="ss">${esc(sum)}</span>` : ''}</span><span class="chev">›</span></button>`);

  root.querySelectorAll('.secbtn[data-open]').forEach(b => b.onclick = () => openSec(b.dataset.open));
  // pliegues dentro de una pantalla (opciones, configuración)

    const k = el.dataset.fold, isOpen = foldOpen.has(k);
    el.insertAdjacentHTML('beforebegin', `<button type="button" class="sm foldbtn" data-fk="${esc(k)}"><span>${esc(el.dataset.title || 'Opciones')}${el.dataset.sum ? ` <span class="hint">· ${esc(el.dataset.sum)}</span>` : ''}</span><span>${isOpen ? '▴' : '▾'}</span></button>`);

  if (open) {

    open.classList.remove('cmp-hid');

let treeQuery = '';

async function refreshPointLast(pid) {
  const pt = await DB.get('points', pid); if (!pt) return;
  const ms = (await DB.by('measurements', 'pointId', pid)).sort(byWhen)[0];
  const sum = ms ? { id: ms.id, when: ms.when, rpm: ms.rpm, load: ms.load, overall: ms.overall, device: ms.device, operator: ms.operator } : null;
  if (isOp() && pt.last && (!sum || pt.last.when > sum.when)) return;   // en el móvil se conserva el dato del plan si es más reciente
  pt.last = sum; await DB.put('points', pt, false);

async function renderTree(sel) {
  const T = $('#tree'); if (!T) return;
  const [plants, machines, points] = await Promise.all(['plants','machines','points'].map(s => DB.all(s)));
  const open = new Set(pref.get('treeOpen', []));
  // abrir el camino hasta la selección
  if (sel.k === 'p') { const pt = points.find(x => x.id === sel.id), m = machines.find(x => x.id === pt?.machineId); if (m) { open.add(m.id); open.add(m.plantId); } }
  if (sel.k === 'q') { const m = machines.find(x => x.id === sel.id); if (m) { open.add(m.id); open.add(m.plantId); } }
  if (sel.k === 'b') open.add(sel.id);
  pref.set('treeOpen', [...open]);
  const q = treeQuery.trim().toLowerCase(), hit = t => !q || t.toLowerCase().includes(q);
  const zPt = (pt, m) => pt.last?.overall ? evalAlarm(pt.last.overall, pt, m).level : -1;
  const node = (k, id, name, z, ct, hasKids, isOpen, extra='') =>
    `<div class="tn ${sel.k === k && sel.id === id ? 'sel' : ''}" data-k="${k}" data-id="${id}">
      <span class="cr" data-tg="${hasKids ? id : ''}">${hasKids ? (isOpen ? '▾' : '▸') : ''}</span>
      <span class="zd" style="background:${ZDOT(z)}" title="${z < 0 ? 'sin medidas' : ALNAME[z]}"></span>
      <span class="nm">${extra}${esc(name)}</span>${ct != null ? `<span class="ct">${ct}</span>` : ''}</div>`;
  let html = `<input id="tq" placeholder="Buscar…" value="${esc(treeQuery)}">
    <div class="tn ${sel.k === 'bd' ? 'sel' : ''}" data-k="bd"><span class="cr"></span><span class="nm"><b>Todos los barcos</b></span><span class="ct">${plants.length}</span></div>`;
  for (const p of plants.sort((a, b) => a.name.localeCompare(b.name))) {
    const ms_ = machines.filter(m => m.plantId === p.id).sort((a, b) => a.name.localeCompare(b.name));
    let pz = -1, inner = '', pHit = hit(p.name) || !q;
    for (const m of ms_) {
      const pts = points.filter(x => x.machineId === m.id).sort((a, b) => (a.code || a.name).localeCompare(b.code || b.name));
      let mz = -1, ptsHtml = '';
      const mHit = hit(m.name);
      for (const pt of pts) {
        const z = zPt(pt, m); mz = Math.max(mz, z);
        if (q && !hit(pt.name + ' ' + (pt.code || '')) && !mHit && !hit(p.name)) continue;
        ptsHtml += node('p', pt.id, pt.name, z, pt.last ? new Date(pt.last.when).toLocaleDateString([], { day: 'numeric', month: 'short' }) : null, false, false, pt.code ? `<b>${esc(pt.code)}</b> · ` : '');
      }
      pz = Math.max(pz, mz);
      if (q && !ptsHtml && !mHit && !hit(p.name)) continue;
      const mo = q ? true : open.has(m.id);
      inner += node('q', m.id, m.name, mz, pts.length, pts.length > 0, mo) + (mo && ptsHtml ? `<div class="tk">${ptsHtml}</div>` : '');
    }
    if (q && !inner && !pHit) continue;
    const po = q ? true : open.has(p.id);
    html += node('b', p.id, p.name, pz, ms_.length, ms_.length > 0, po) + (po && inner ? `<div class="tk">${inner}</div>` : '');
  }
  html += `<div class="row adm" style="margin-top:10px"><button class="sm" id="tNew">+ Barco</button><button class="sm" id="tAll">Expandir todo</button><button class="sm" id="tNone">Plegar</button></div>
    <p class="hint" style="margin:8px 6px 0">● última medida: <span style="color:var(--ok)">normal</span> · <span style="color:var(--warn)">aviso</span> · <span style="color:var(--err)">peligro</span></p>`;
  T.innerHTML = html;
  $$('#tree .tn').forEach(el => el.onclick = e => {
    const tg = e.target.closest('[data-tg]')?.dataset.tg;
    if (tg) { const o = new Set(pref.get('treeOpen', [])); o.has(tg) ? o.delete(tg) : o.add(tg); pref.set('treeOpen', [...o]); renderTree(sel); return; }
    const k = el.dataset.k, id = el.dataset.id;
    $('#tree').classList.remove('open');

  tq.oninput = () => { treeQuery = tq.value; renderTree(sel).then(() => { const n = $('#tq'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); }); };

  $('#tAll').onclick = () => { pref.set('treeOpen', [...plants.map(x => x.id), ...machines.map(x => x.id)]); renderTree(sel); };
  $('#tNone').onclick = () => { pref.set('treeOpen', []); renderTree(sel); };
}

/* copia de un punto sin medidas ni referencia: configuración, posición del sensor y alarmas */
/* «Bomba de lastre 1» → «Bomba de lastre 2», «M1» → «M2» */
const bumpName = t => t && /\d+(?!.*\d)/.test(t) ? t.replace(/(\d+)(?!.*\d)/, d => String(+d + 1)) : t;
/* primer nombre libre: sube el último número hasta no repetir; si no hay número, añade el sufijo */
function freeName(t, used, suffix) {
  if (!t) return t;
  if (!/\d+(?!.*\d)/.test(t)) { let c = t + suffix, k = 2; while (suffix && used.includes(c)) c = `${t}${suffix} ${k++}`; return c; }
  let c = bumpName(t); for (let i = 0; i < 200 && used.includes(c); i++) c = bumpName(c); return c;
}

/* ---------------- Máquina ---------------- */
/* Orientación del sensor: ubicación (lado libre, intermedio, lado acoplado), Z con signo y X con signo.
   Ejes de la máquina: +A hacia el lado acoplado (derecha en el dibujo), +V arriba, +H hacia el observador. Y = Z × X. */
const POSN = { NDE: 'Lado libre', MID: 'Intermedio', DE: 'Lado acoplado' };
const orientDefault = { pos: 'DE', z: '+V', x: '+H' };
const DVEC = { A: [1,0,0], V: [0,1,0], H: [0,0,1] };
const svec = sd => DVEC[sd[1]].map(v => sd[0] === '-' ? -v : v);
const vsd = v => { for (const d of DIRS) { const k = v[0]*DVEC[d][0] + v[1]*DVEC[d][1] + v[2]*DVEC[d][2]; if (k > .5) return '+' + d; if (k < -.5) return '-' + d; } return '+H'; };
const xprod = (a, b) => [a[1]*b[2] - a[2]*b[1], a[2]*b[0] - a[0]*b[2], a[0]*b[1] - a[1]*b[0]];
function normOrient(o) {
  o = { ...(o || {}) };
  if (o.z && o.z.length === 1) o.z = '+' + o.z;
  if (o.x && o.x.length === 1) o.x = '+' + o.x;
  o.z ||= '+V'; o.pos ||= 'DE';
  if (!o.x || o.x[1] === o.z[1]) o.x = ['+H','+A','+V'].find(x => x[1] !== o.z[1]);
  return o;
}
function orientSigned(o) { o = normOrient(o); return { X: o.x, Y: vsd(xprod(svec(o.z), svec(o.x))), Z: o.z }; }
function orientMap(o) { const sg = orientSigned(o); return { X: sg.X[1], Y: sg.Y[1], Z: sg.Z[1] }; }
const sgn = sd => (sd[0] === '-' ? '−' : '+') + sd[1];
const orientText = o => { const n = normOrient(o), sg = orientSigned(n); return `${POSN[n.pos]} · ` + SAX.map(a => `${a}→${sgn(sg[a])}`).join(' · '); };

let recTimer = null;
function recIndicator(on, acq) {
  clearInterval(recTimer);
  const rt = $('#recTime');
  if (rt) {   // pantalla de medida libre
    if (!on) { rt.textContent = ''; return; }
    const t0 = performance.now();
    const tick = () => { const t = $('#recTime'); if (t) t.textContent = ` · bloque ${Math.max(0, acq - (performance.now() - t0)/1000).toFixed(1)} s`; };
    tick(); recTimer = setInterval(tick, 100);
    if (navigator.vibrate) try { navigator.vibrate(80); } catch (e) {}
    return;
  }
  const b = $('#bMeas'); if (!b) return;
  if (!on) { b.classList.remove('rec'); b.textContent = 'Midiendo…'; return; }
  const t0 = performance.now(); b.classList.add('rec');
  const tick = () => { b.textContent = `● GRABANDO · ${Math.max(0, acq - (performance.now() - t0)/1000).toFixed(1)} s`; };
  tick(); recTimer = setInterval(tick, 100);
  if (navigator.vibrate) try { navigator.vibrate(80); } catch (e) {}
}

  const asc = ms.slice().reverse();
  tr.series = DIRS.filter(d => asc.some(x => x.overall?.[d])).map(d => {
    const rows = asc.filter(x => x.overall?.[d]);

  });
  tr.hlines = [];
  tr.onclick = x => { if (!asc.length) return; let best = asc[0]; for (const r of asc) if (Math.abs(Date.parse(r.when) - x) < Math.abs(Date.parse(best.when) - x)) best = r; location.hash = '#/m/' + best.id; };
  tr.draw();

  const ac = alarmCfg(pt, m);

      { k: 'relWarn', label: 'Ajuste del punto · aviso relativo (%)', type: 'number', min: 0, ph: 'vacío = el del perfil' },

    if (!v) return;
    if (v === '__delete') { delete pt.alarm.ref; }
    else { pt.alarm = { ...a }; for (const [k, x] of Object.entries(v)) { if (x == null || x === '') delete pt.alarm[k]; else pt.alarm[k] = x; } }
    await DB.put('points', pt); route();
  };
  $('#bDup').onclick = () => dupPoint(pt, m);
  // editar
  $('#bEdit').onclick = async () => {
    const v = await formDialog('Editar punto', pointFields(pt, locked), { ...pt, ...pt.cfg, fcut: fcutOf(pt.cfg) }, { danger: 'Borrar punto' });
    if (v === '__delete') { if (confirmDel(`el punto «${pt.name}» y sus ${ms.length} medidas`)) { await delPointDeep(pt.id); location.hash = '#/q/' + m.id; } return; }
    if (!v) return;
    pt.name = v.name; pt.code = v.code; pt.notes = v.notes;
    if (!locked) pt.cfg = { mode: +v.mode, navg: +v.navg, win: +v.win };
    pt.cfg.dirs = v.dirs || 'HVA';
    const fc = v.fcut === '' || v.fcut == null || !(+v.fcut >= 0) ? FCUT_DEF : +v.fcut, oldFc = fcutOf(pt.cfg);
    pt.cfg.fcut = fc;
    await DB.put('points', pt);
    if (fc !== oldFc) await applyFcut(pt.id, fc);
    route();
  };
  // medir
  setChip();
  $('#bMeas').onclick = () => measurePoint(pt, m);
}

const AXC = { X: '#8b3fd9', Y: '#b7791f', Z: 'var(--fg)' };   // colores fijos de los ejes locales del sensor

let curOrient = normOrient(orientDefault);

        <rect x="70" y="148" width="18" height="16" style="fill:var(--muted);opacity:.6"/><rect x="160" y="148" width="18" height="16" style="fill:var(--muted);opacity:.6"/>
        <rect x="56" y="88" width="14" height="52" rx="3" style="fill:var(--card);stroke:var(--muted);stroke-width:1.5"/>

const OW_X = { NDE: 63, MID: 127, DE: 195 };
const OW_TOP = { NDE: 88, MID: 72, DE: 90 }, OW_BOT = { NDE: 140, MID: 152, DE: 138 };
const OW_AX = { NDE: { '+A': 70, '-A': 56 }, MID: { '+A': 147, '-A': 107 }, DE: { '+A': 204, '-A': 186 } };
/* vector 2D (svg) de una dirección con signo; null si es ±H (perpendicular al dibujo) */
const v2 = sd => sd[1] === 'A' ? [sd[0] === '-' ? -1 : 1, 0] : sd[1] === 'V' ? [0, sd[0] === '-' ? 1 : -1] : null;
function bindOrient(o) {
  curOrient = normOrient(o);
  const draw = () => {
    const c = curOrient, sg = orientSigned(c), G = $('#owGlyph'); if (!G) return;
    const body = 'fill:#fbfbfa;stroke:#8a929c;stroke-width:1.3', hex = 'fill:#b9bfc6;stroke:#7b838d;stroke-width:1.1';
    const axArrow = (ax, x0, y0, len) => {   // eje local en el dibujo de la máquina
      const sd = sg[ax], u = v2(sd);
      if (!u) return `<g><circle cx="${x0}" cy="${y0}" r="6.5" style="fill:var(--card);stroke:${AXC[ax]};stroke-width:2.2"/>${sd[0] === '+' ? `<circle cx="${x0}" cy="${y0}" r="2.3" style="fill:${AXC[ax]}"/>` : `<path d="M${x0-4},${y0-4} L${x0+4},${y0+4} M${x0+4},${y0-4} L${x0-4},${y0+4}" style="stroke:${AXC[ax]};stroke-width:1.8"/>`}<text x="${x0+9}" y="${y0-8}" style="fill:${AXC[ax]};font-size:12px">${ax}</text></g>`;
      const x1 = x0 + u[0]*len, y1 = y0 + u[1]*len;
      return `<line x1="${x0}" y1="${y0}" x2="${x1}" y2="${y1}" style="stroke:${AXC[ax]};stroke-width:2.4" marker-end="url(#mk${ax})"/><text x="${x1 + (u[0] ? u[0]*5 : 5)}" y="${y1 + (u[1] ? u[1]*6 + 4 : -5)}" text-anchor="${u[0] < 0 ? 'end' : 'start'}" style="fill:${AXC[ax]};font-size:12px">${ax}</text>`;
    };
    let html = '';
    const zu = v2(c.z);
    if (zu) {
      // montaje en cara superior/inferior/axial: cuerpo del sensor a lo largo de Z
      const ang = zu[1] === -1 ? 0 : zu[0] === 1 ? 90 : zu[1] === 1 ? 180 : 270;
      const ax = c.z[1] === 'V' ? OW_X[c.pos] : OW_AX[c.pos][c.z];
      const ay = c.z[1] === 'V' ? (c.z[0] === '+' ? OW_TOP[c.pos] : OW_BOT[c.pos]) : 114;
      const cx = ax + zu[0]*15, cy = ay + zu[1]*15;
      html += `<g transform="translate(${ax},${ay}) rotate(${ang})"><rect x="-11" y="-5" width="22" height="5" rx="1" style="${hex}"/><rect x="-8" y="-28" width="16" height="23" rx="5" style="${body}"/></g>`;
      html += axArrow('Z', ax + zu[0]*29, ay + zu[1]*29, 22);
      html += axArrow('X', cx, cy, 30) + axArrow('Y', cx, cy, 30);
    } else {
      // montaje en cara frontal (+H, visto de frente) o trasera (−H, oculto)
      const cx = OW_X[c.pos], cy = 114, back = c.z[0] === '-';
      html += `<circle cx="${cx}" cy="${cy}" r="13" style="${hex};${back ? 'opacity:.45;stroke-dasharray:3 2' : ''}"/><circle cx="${cx}" cy="${cy}" r="9" style="${body};${back ? 'opacity:.45' : ''}"/>`;
      html += axArrow('Z', cx, cy, 0) + axArrow('X', cx, cy, 32) + axArrow('Y', cx, cy, 32);
    }
    G.innerHTML = html;
    $$('#owM .hit .ring').forEach(r => { const on = r.parentNode.dataset.pos === c.pos; r.style.stroke = on ? 'var(--acc)' : 'var(--line)'; r.style.strokeDasharray = on ? '' : '3 3'; });
    // detalle del sensor (siempre en la misma pose; colores fijos por eje local)
    const S = $('#owS');
    const hx = (x0, y0, rx, ry) => Array.from({ length: 6 }, (_, i) => { const a = Math.PI/6 + i*Math.PI/3; return `${(x0 + rx*Math.cos(a)).toFixed(1)},${(y0 + ry*Math.sin(a)).toFixed(1)}`; }).join(' ');
    const lab = (ax, x0, y0, anchor='start') => `<text x="${x0}" y="${y0}" text-anchor="${anchor}"><tspan style="fill:${AXC[ax]}">${ax}</tspan><tspan style="fill:var(--muted)"> → </tspan><tspan style="fill:var(${DCOL[sg[ax][1]]})">${sgn(sg[ax])} ${DNAME[sg[ax][1]]}</tspan></text>`;
    S.innerHTML = `<defs>${['X','Y','Z'].map(a => `<marker id="sk${a}" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" style="fill:${AXC[a]}"/></marker>`).join('')}
        <linearGradient id="gBody" x1="0" x2="1"><stop offset="0" stop-color="#e9ebee"/><stop offset=".45" stop-color="#ffffff"/><stop offset="1" stop-color="#d4d8dd"/></linearGradient>
        <linearGradient id="gHex" x1="0" x2="1"><stop offset="0" stop-color="#9aa1aa"/><stop offset=".5" stop-color="#d7dbe0"/><stop offset="1" stop-color="#8b929b"/></linearGradient></defs>
      <polygon points="${hx(110, 162, 52, 15)}" style="fill:#7f868f"/>
      <rect x="58" y="150" width="104" height="12" style="fill:url(#gHex)"/>
      <polygon points="${hx(110, 150, 52, 15)}" style="fill:url(#gHex);stroke:#7b838d;stroke-width:1"/>
      <path d="M78,150 L78,82 A32,10 0 0 1 142,82 L142,150 A32,10 0 0 1 78,150 z" style="fill:url(#gBody);stroke:#8a929c;stroke-width:1.3"/>
      <ellipse cx="110" cy="82" rx="32" ry="10" style="fill:#f7f8f9;stroke:#8a929c;stroke-width:1.3"/>
      <rect x="104" y="128" width="12" height="7" rx="2" style="fill:#f0a35a;opacity:.85"/>
      <path d="M96,154 l16,0 m-5,-3 l5,3 l-5,3" style="stroke:${AXC.X};stroke-width:1.6;fill:none"/>
      <line x1="110" y1="68" x2="110" y2="20" style="stroke:${AXC.Z};stroke-width:3" marker-end="url(#skZ)"/>
      <line x1="164" y1="156" x2="208" y2="156" style="stroke:${AXC.X};stroke-width:3" marker-end="url(#skX)"/>
      <line x1="72" y1="140" x2="40" y2="118" style="stroke:${AXC.Y};stroke-width:3" marker-end="url(#skY)"/>
      ${lab('Z', 118, 28)}${lab('X', 214, 182, 'end')}${lab('Y', 4, 108)}`;
    // botones
    $$('#oPos button').forEach(b => b.classList.toggle('on', b.dataset.pos === c.pos));
    $$('#oZseg button').forEach(b => b.classList.toggle('on', b.dataset.z === c.z));
    $('#oRotTxt').innerHTML = `X apunta a <b style="color:var(${DCOL[sg.X[1]]})">${sgn(sg.X)}</b>, Y a <b style="color:var(${DCOL[sg.Y[1]]})">${sgn(sg.Y)}</b>`;
    $('#oMap').innerHTML = `<b>${POSN[c.pos]}</b> · ` + SAX.map(a => `<span style="color:${AXC[a]};font-weight:700">${a}</span>→<b style="color:var(${DCOL[sg[a][1]]})">${sgn(sg[a])}</b>`).join(' · ')
      + '<br><span class="hint">Colores fijos del sensor: X violeta · Y ocre · Z gris. Direcciones de la máquina: H rojo · V azul · A verde. La flecha X está grabada en la base hexagonal.</span>';
  };
  $$('#oPos button, #owM .hit').forEach(b => b.onclick = () => { curOrient.pos = b.dataset.pos; draw(); });
  $$('#oZseg button').forEach(b => b.onclick = () => { curOrient = normOrient({ ...curOrient, z: b.dataset.z, x: curOrient.x[1] === b.dataset.z[1] ? null : curOrient.x }); draw(); });
  $('#oRot').onclick = () => { curOrient.x = vsd(xprod(svec(curOrient.z), svec(curOrient.x))); draw(); };   // +90° sobre Z: X pasa a ser la antigua Y
  draw();
}
/* Mide los 3 ejes con la configuración dada y guarda la medida (pointId null = medida libre) */
async function runMeasure({ cfg, orient, rpm, load, note, pointId, roundId, ctl }) {
  /* ctl (opcional, medida libre): { paused, cmd: 'save'|'cancel'|'reset', onBlock(d, cg, meas, r), onState(txt) }
     cfg.navg = 0 → continuo hasta que se pause y se guarde */
  const om = orientMap(orient), fs = MODES[cfg.mode], quiet = pref.get('quiet', true), block = pref.get('blk', 120);
  const codes = { X: pref.get('codeX', 4), Y: pref.get('codeY', 2), Z: pref.get('codeZ', 1) };
  const meas = { id: uid(), pointId: pointId || null, roundId: roundId || null, when: nowIso(), device: devName(), operator: opName(), rpm: rpm || null, load: load ?? null, note: note || '', orient, axisMap: om,
                 cfg: { mode: cfg.mode, fs, navg: cfg.navg, win: cfg.win, dirs: cfg.dirs || 'HVA', fcut: fcutOf(cfg) }, quiet, unit: 'cg', dirs: {}, sensor: { ...Sensor.info } };
  const prog = (f, msg) => {   // tolerante a que la pantalla haya cambiado durante la medida
    const P = $('#prog'), I = $('#prog i'), M = $('#pmsg');
    if (P) P.style.display = f == null ? 'none' : 'block';
    if (I && f != null) I.style.width = (100*f).toFixed(1) + '%';
    if (M && msg != null) M.textContent = msg;
  };
  const want = cfg.dirs || 'HVA', axes = SAX.filter(ax => want.includes(om[ax]));
  const cont = !(cfg.navg > 0), total = cont ? axes.length : axes.length*cfg.navg;
  let step = 0, r = 0; const timing = {}, tStart = performance.now();
  const frac = x => cont ? (x % total)/total : x/total;
  const nBlocks = () => Object.values(meas.dirs).reduce((a, b) => a + b.length, 0);
  // espera en pausa y devuelve la orden pendiente (save / cancel / reset) o null para seguir
  const gate = async () => {
    if (!ctl) return null;
    let said = false;
    for (;;) {
      if (ctl.cmd) { const c = ctl.cmd; ctl.cmd = null; return c; }
      if (!ctl.paused) return null;
      if (!said) { prog(frac(step), `En pausa · ${nBlocks()} bloques adquiridos`); ctl.onState?.('paused'); said = true; }
      await sleep(150);
    }
  };
  busy = true; setChip();
  try {
    try { const st = await Sensor.status(); meas.sensor.temp = st.temp; meas.sensor.battery = st.battery; } catch (e) {}
    let partial = null, stopped = false;
    outer: while (cont || r < cfg.navg) {
      for (const ax of axes) {
        const g = await gate();
        if (g === 'cancel') { log('Medida libre descartada'); prog(null, ''); return null; }
        if (g === 'save') { stopped = true; break outer; }
        if (g === 'reset') { meas.dirs = {}; r = 0; step = 0; meas.when = nowIso(); log('Medida reiniciada'); ctl.onBlock?.(null, null, meas, 0); continue outer; }
        ctl?.onState?.('rec');
        const d = om[ax], tag = `${DNAME[d]} (${ax})${cont ? ` · promedio ${r+1}` : cfg.navg > 1 ? ` · ${r+1}/${cfg.navg}` : ''}`;
        let cg = null;
        for (let att = 0; att < 3 && !cg; att++) {
          try {
            if (att) { prog(frac(step), `${tag}: reintentando (${att + 1}/3)…`); log(`${tag}: reintento ${att + 1}/3`, 'warn'); if (!Sensor.connected()) await Sensor.reconnect(10); }
            cg = await Sensor.measureAxis(codes[ax], cfg.mode, { quiet, block,
              onStage: st => prog(frac(step), `${tag}: ${st}…`), onProg: f => prog(frac(step + f)), onRec: (on, acq) => recIndicator(on, acq) });
          } catch (e) {
            log(`${tag}: ${e.message}`, 'warn');
            if (att === 2) {
              if (ctl) {   // medida libre: se guarda lo que haya
                if (nBlocks() && confirm(`No se pudo seguir midiendo (${e.message}).\n\n¿Guardar lo adquirido hasta ahora?`)) { stopped = true; break outer; }
                throw e;
              }
              const have = axes.every(a => meas.dirs[om[a]]?.length);
              if (have && confirm(`No se pudo completar el promedio ${r+1}/${cfg.navg} (${e.message}).\n\n¿Guardar la medida con ${r === 1 ? 'el promedio ya hecho' : 'los ' + r + ' promedios ya hechos'}?`)) { partial = r; break outer; }
              throw e;
            }
            await sleep(1500);
          }
        }
        (meas.dirs[d] ||= []).push(cg);
        for (const [k, v] of Object.entries(Sensor.lastTiming || {})) timing[k] = (timing[k] || 0) + v;
        step++;
        try { ctl?.onBlock?.(d, cg, meas, r + 1); } catch (e) { console.error(e); }
      }
      r++;
    }
    if (partial != null) {   // se guardan solo promedios completos (todas las direcciones)
      for (const d of Object.keys(meas.dirs)) meas.dirs[d] = meas.dirs[d].slice(0, partial);
      meas.cfg.navgDone = partial; meas.note = ((meas.note || '') + ` [${partial} de ${cfg.navg} promedios]`).trim();
      log(`Medida guardada con ${partial} de ${cfg.navg} promedios`, 'warn');
    }
    if (ctl) {   // medida libre: navg real; si las direcciones quedaron desiguales, se anota
      const cnt = DIRS.filter(d => meas.dirs[d]?.length).map(d => [d, meas.dirs[d].length]);
      if (!cnt.length) { prog(null, 'No hay datos que guardar.'); return null; }
      const mx = Math.max(...cnt.map(c => c[1])), mn = Math.min(...cnt.map(c => c[1]));
      meas.cfg.navg = mx;
      if (stopped && (mn !== mx || (!cont && mx < cfg.navg))) meas.note = ((meas.note || '') + ` [${cnt.map(([d, n]) => d + ' ' + n).join(' · ')} prom.]`).trim();
    }
    timing.total = (performance.now() - tStart)/1000; timing.ejes = step;
    meas.timing = timing; if (step) pref.set('lastTiming', { ...timing, when: nowIso(), mode: cfg.mode });
    log(`Tiempos: ${fmtTiming(timing)}`);
    meas.overall = overallOf(meas);
    await DB.put('measurements', meas, false);
    log(`Medida ${pointId ? 'guardada' : 'libre'}: ${DIRS.map(d => d + ' ' + fmt(meas.overall[d]?.v)).join(' · ')} mm/s`, 'ok');
    return meas;
  } catch (e) {
    log('Medida: ' + e.message, 'err'); prog(null, 'Error: ' + e.message + ' — la medida no se ha guardado.');
    return null;
  } finally { busy = false; recIndicator(false); setChip(); ctl?.onState?.('idle'); }
}
async function measurePoint(pt, mach) {
  if (busy || !Sensor.connected()) return;
  const rpm = +$('#mRpm').value, load = $('#mLoad').value === '' ? NaN : +$('#mLoad').value;
  if (!(rpm > 0)) { $('#mRpm').focus(); return alert('Introduce las revoluciones (rpm) de la máquina.'); }
  if (!(load >= 0 && load <= 150)) { $('#mLoad').focus(); return alert('Introduce la carga en % (0–100).'); }
  const orient = readOrient();

  if (!meas) return;

}

const TNAME = { config: 'configuración', grabacion: 'grabación', corte: 'corte BLE', reconexion: 'reconexión', descarga: 'descarga' };
const fmtTiming = t => Object.keys(TNAME).filter(k => t[k] != null).map(k => `${TNAME[k]} ${t[k].toFixed(1)} s`).join(' · ') + (t.total ? ` · total ${t.total.toFixed(1)} s` : '');
/* Tiempo estimado de una medida con la última experiencia real */
function estMeasure(cfg) {
  const lt = pref.get('lastTiming', null), acq = 4096/MODES[cfg.mode], n = (cfg.dirs || 'HVA').length*cfg.navg;
  if (lt?.ejes) { const over = (lt.total - (lt.grabacion || 0))/lt.ejes; return Math.round(n*(acq + 0.3 + over)); }
  return Math.round(n*(acq + (pref.get('quiet', true) ? 8 : 5)));
}
/* Prueba: ¿graba el sensor los tres ejes con un solo disparo?
   Se selecciona cada eje (FA01 + FA10) SIN disparar y se lee lo que haya guardado, antes y después de disparar solo Z. */
async function testSimultaneous() {
  if (busy || !Sensor.connected()) return alert('Conecta el sensor primero.');
  const out = $('#simMsg'); const say = t => { if (out) out.innerHTML = t; };
  const codes = { X: pref.get('codeX', 4), Y: pref.get('codeY', 2), Z: pref.get('codeZ', 1) };
  const eq = (a, b) => a && b && a.length === b.length && a.every((v, i) => v === b[i]);
  const readAxis = async ax => { try { await Sensor.commit(codes[ax], 3); await sleep(300); return await Sensor.download(codes[ax], 120, () => {}, 8); } catch (e) { return null; } };
  busy = true; setChip();
  try {
    const pre = {};
    for (const ax of ['X','Y']) { say(`1/3 · Seleccionando ${ax} y leyendo lo guardado (sin disparar)…`); pre[ax] = await readAxis(ax); }
    say('2/3 · Disparando una medida <b>solo del eje Z</b>…');
    const z = await Sensor.measureAxis(codes.Z, 3, { quiet: pref.get('quiet', true), onStage: st => say('2/3 · ' + st + '…') });
    const res = [];
    for (const ax of ['X','Y']) {
      say(`3/3 · Seleccionando ${ax} y leyendo de nuevo (sin disparar)…`);
      const post = await readAxis(ax);
      res.push({ ax, pre: !!pre[ax], post: !!post, changed: pre[ax] && post ? !eq(pre[ax], post) : null, sameAsZ: post ? eq(post, z) : false });
    }
    const txt = r => `${r.ax}: ${!r.post ? 'sin datos' : r.sameAsZ ? 'devuelve lo mismo que Z' : r.changed === null ? 'con datos (antes no tenía)' : r.changed ? 'datos nuevos' : 'sin cambios'}`;
    const allNew = res.every(r => r.post && !r.sameAsZ && (r.changed !== false));
    const noneData = res.every(r => !r.post), stale = res.every(r => r.post && r.changed === false), echo = res.every(r => r.sameAsZ);
    const verdict = allNew ? '<b style="color:var(--ok)">El sensor graba los tres ejes con un solo disparo.</b> Se puede medir unas 3 veces más rápido y con los ejes simultáneos.'
      : noneData ? '<b>El sensor solo guarda el eje que se ha disparado.</b> Hay que medir eje a eje.'
      : stale ? '<b>El sensor graba un eje por disparo</b> (X e Y conservan su medida anterior). Hay que medir eje a eje.'
      : echo ? '<b>El sensor devuelve el mismo bloque para cualquier eje:</b> graba un eje por disparo.'
      : 'Resultado no concluyente. Repite la prueba.';
    say(res.map(txt).join(' · ') + '<br>' + verdict);
    log('Prueba de captura simultánea: ' + res.map(txt).join(' · ') + ' → ' + verdict.replace(/<[^>]+>/g, ''), 'ok');
    try { await Sensor.commit(codes.Z, null); } catch (e) {}
  } catch (e) { say('Error: ' + esc(e.message)); }
  finally { busy = false; setChip(); }
}

      <div id="wMachNew" hidden class="row">

        <label class="field"><span>Tipo</span><select id="sMachType">${MACH_TYPES.map(t => opt(t, t)).join('')}</select></label>
        <label class="field"><span>rpm nominal *</span><input type="number" id="sMachRpm" step="any" min="1" value="${ms.rpm ?? ''}"></label>
        <label class="field" style="flex-basis:100%"><span>Perfil de alarma</span><select id="sMachTpl">${tplSelect().map(([v, n]) => opt(v, n, v === pref.get('freeTpl', TPL_DEF))).join('')}</select></label>
      </div>
      <label class="field"><span>Punto</span><select id="sPt"></select><small id="sPtHint"></small></label>
      <div id="wPtNew" hidden class="row">
        <label class="field" style="flex-basis:60%"><span>Nombre del punto nuevo *</span><input id="sPtName" placeholder="p. ej. Motor lado acoplamiento"></label>
        <label class="field"><span>Código</span><input id="sPtCode" placeholder="M1"></label>

      <div class="acts"><button type="button" id="sCancel">Cancelar</button><button class="pri" id="sOk">Guardar</button></div>
    </form>`;
    const fillPlants = () => { $('#sPlant').innerHTML = plants.map((p, i) => opt(p.id, p.name, i === 0)).join('') + opt('__new', '➕ Nuevo barco…', !plants.length); onPlant(); };
    const onPlant = () => {

      const ms_ = machines.filter(m => m.plantId === pid).sort((a, b) => a.name.localeCompare(b.name));
      $('#sMach').innerHTML = ms_.map((m, i) => opt(m.id, m.name, i === 0)).join('') + opt('__new', '➕ Nueva máquina…', !ms_.length);
      onMach();
    };
    const onMach = () => {
      const mid = $('#sMach').value; $('#wMachNew').hidden = mid !== '__new';
      const pts = points.filter(x => x.machineId === mid).sort((a, b) => (a.code || a.name).localeCompare(b.code || b.name));

        if (ok && !firstOk) firstOk = pt.id;
        return opt(pt.id, `${pt.code ? pt.code + ' · ' : ''}${pt.name}${ok ? '' : ' (otra configuración)'}`, false, !ok);
      }).join('');
      $('#sPt').innerHTML = html + opt('__new', '➕ Nuevo punto…', false);
      $('#sPt').value = firstOk || '__new';
      onPt();
    };
    const onPt = () => {
      const v = $('#sPt').value; $('#wPtNew').hidden = v !== '__new';
      const pt = points.find(x => x.id === v);
      $('#sPtHint').textContent = v === '__new' ? 'Se creará con la configuración de esta medida y quedará bloqueada.'
        : pt && !nMeas(pt.id) && !sameCfg(pt) ? 'El punto aún no tiene medidas: se le asignará la configuración de esta medida.'
        : 'Misma configuración: las medidas serán comparables.';
    };
    $('#sPlant').onchange = onPlant; $('#sMach').onchange = onMach; $('#sPt').onchange = onPt;
    fillPlants();
    let done = false;
    const finish = v => { if (done) return; done = true; d.close(); resolve(v); };
    $('#sCancel').onclick = () => finish(null);

    d.querySelector('form').onsubmit = async e => {
      e.preventDefault();

      if (mid === '__new' && need(+$('#sMachRpm').value > 0, $('#sMachRpm'), 'Indica las rpm nominales de la máquina.')) return;
      if (ptid === '__new' && need($('#sPtName').value.trim(), $('#sPtName'), 'Pon nombre al punto nuevo.')) return;

      if (mid === '__new') { const m = { id: uid(), plantId: pid, created: nowIso(), name: $('#sMachName').value.trim(), type: $('#sMachType').value, location: '', rpm: +$('#sMachRpm').value, kw: null, alarmTpl: $('#sMachTpl').value, notes: '' }; await DB.put('machines', m); mid = m.id; }
      if (ptid === '__new') {
        const pt = { id: uid(), machineId: mid, created: nowIso(), name: $('#sPtName').value.trim(), code: $('#sPtCode').value.trim(), notes: '', cfg: { mode: ms.cfg.mode, navg: ms.cfg.navg, win: ms.cfg.win, dirs: ms.cfg.dirs || 'HVA' }, orient: ms.orient };

      await DB.put('measurements', ms, false); await refreshPointLast(ptid);
      log('Medida libre guardada en un punto', 'ok');
      finish(ptid);
    };
    d.showModal();
  });
}

/* Cambia el corte inferior de todas las medidas de un punto y recalcula sus globales */
async function applyFcut(pointId, fc) {
  for (const x of await DB.by('measurements', 'pointId', pointId)) { x.cfg.fcut = fc; x.overall = overallOf(x); await DB.put('measurements', x, false); }
  await refreshPointLast(pointId);
  const p2 = await DB.get('points', pointId);
  if (p2?.alarm?.ref?.id) { const r = await DB.get('measurements', p2.alarm.ref.id); if (r) { p2.alarm.ref.overall = r.overall; await DB.put('points', p2, false); } }
  log(`Corte inferior ${fmt(fc, 3)} Hz aplicado a las medidas del punto`, 'ok');
}

/* =====================================================================
   Rutas y rondas
   ===================================================================== */
const DAY = 864e5;
const PERIODS = [[7,'Semanal'],[14,'Quincenal'],[30,'Mensual'],[60,'Bimestral'],[90,'Trimestral'],[180,'Semestral'],[365,'Anual']];
const periodName = d => (PERIODS.find(p => p[0] === d) || [0, `Cada ${d} días`])[1];
async function routeState(r) {
  const rounds = (await DB.by('rounds', 'routeId', r.id)).sort((a, b) => (a.started < b.started ? 1 : -1));
  const open = rounds.find(x => !x.finished);
  let lastDone = rounds.filter(x => x.finished).sort((a, b) => (a.finished < b.finished ? 1 : -1))[0];
  if (r.lastDone && (!lastDone || r.lastDone > lastDone.finished)) lastDone = { finished: r.lastDone };   // dato de la oficina
  const due = lastDone ? Date.parse(lastDone.finished) + r.period*DAY : null;
  const days = due == null ? null : Math.ceil((due - Date.now())/DAY);
  let st;
  if (open) st = { cls: '--acc2', txt: 'En curso' };
  else if (!lastDone) st = { cls: '--warn', txt: 'Nunca realizada' };
  else if (days < 0) st = { cls: '--err', txt: `Vencida hace ${-days} día${days === -1 ? '' : 's'}` };
  else if (days <= Math.max(2, Math.round(r.period*0.15))) st = { cls: '--warn', txt: days === 0 ? 'Vence hoy' : `Vence en ${days} día${days === 1 ? '' : 's'}` };
  else st = { cls: '--ok', txt: `Al día · próxima ${new Date(due).toLocaleDateString([], { day: 'numeric', month: 'short' })}` };
  return { rounds, open, lastDone, due, days, st };
}
const roundProgress = (rd, r) => { const done = r.points.filter(id => rd.items?.[id]).length; return { done, total: r.points.length }; };
const stTag = st => `<span class="tag" style="background:color-mix(in srgb,var(${st.cls}) 16%,transparent);color:var(${st.cls})">${esc(st.txt)}</span>`;

/* ---------------- Lista de rutas (pantalla del operador) ---------------- */
async function vRoutes() {
  const myDev = pref.get('device', '');
  const routes = (await DB.all('routes')).filter(r => !isOp() || !r.assignedTo || r.assignedTo === myDev), plants = await DB.all('plants');
  const rows = [];
  const allPts = await DB.all('points'), allM = await DB.all('machines');
  const nAl = r => r.points.map(id => allPts.find(x => x.id === id)).filter(pt => pt?.last?.overall && evalAlarm(pt.last.overall, pt, allM.find(m => m.id === pt.machineId)).level > 0).length;
  for (const r of routes) rows.push({ r, s: await routeState(r), p: plants.find(x => x.id === r.plantId), na: nAl(r) });
  const rank = x => x.s.open ? 0 : x.s.days == null ? 1 : x.s.days < 0 ? 2 : 3;
  rows.sort((a, b) => rank(a) - rank(b) || (a.s.days ?? 0) - (b.s.days ?? 0) || a.r.name.localeCompare(b.r.name));
  view.innerHTML = `
    <div class="titlebar"><div><h2>Rutas</h2><div class="sub">Tareas programadas de medida</div></div><span class="sp"></span>${plants.length ? '<button class="pri adm" id="bNew">+ Ruta</button>' : ''}</div>
    ${isOp() ? await opBanner() : ''}
    <div class="list">${rows.length ? rows.map(({ r, s: st, p, na }) => {
      const pr = st.open ? roundProgress(st.open, r) : null;
      return `<a class="item" href="#/r/${r.id}"><div class="m">
        <div class="t">${esc(r.name)}</div>
        <div class="d">${!isOp() ? (r.assignedTo ? '📱 ' + esc(r.assignedTo) + ' · ' : '📱 todos · ') : ''}${esc(p?.name || '¿barco borrado?')} · ${r.points.length} punto${r.points.length === 1 ? '' : 's'} · ${periodName(r.period)}${st.lastDone ? ' · última ' + fday(st.lastDone.finished) : ''}</div>
        <div style="margin-top:6px">${stTag(st.st)}${na ? ` <span class="al al1">⚠ ${na} en alarma</span>` : ''}${pr ? ` <span class="hint">${pr.done}/${pr.total} puntos</span>` : ''}</div>
      </div><span class="chev">›</span></a>`;
    }).join('') : `<div class="empty">${isOp() ? 'No hay rutas en este móvil.<br><br><button class="pri" onclick="location.hash=\'#/sync\'">Recibir el plan de la oficina</button>' : plants.length
        ? 'Aún no hay rutas. Una ruta es una lista ordenada de puntos que se mide periódicamente.<br><br><button class="pri" id="bNew2">Crear la primera ruta</button>'
        : 'Primero crea en <a href="#/bd">Base de datos</a> los barcos, máquinas y puntos.<br><span class="hint">o carga unos datos de ejemplo en Ajustes</span>'}</div>`}</div>`;
  const nb = () => editRoute(null);
  if ($('#bNew')) $('#bNew').onclick = nb; if ($('#bNew2')) $('#bNew2').onclick = nb;
}

  const devNames = [...new Set([...Object.keys((await getDevices())), ...(await DB.all('routes')).map(x => x.assignedTo).filter(Boolean)])].sort();
  return new Promise(resolve => {
    const d = $('#dlg');
    d.innerHTML = `<form method="dialog">
      <h4>${r ? 'Editar ruta' : 'Nueva ruta'}</h4>
      <label class="field"><span>Nombre *</span><input id="rName" required value="${esc(r?.name || '')}" placeholder="p. ej. Cámara de máquinas · mensual"></label>
      <div class="row">
        <label class="field"><span>Barco</span><select id="rPlant" ${r ? 'disabled' : ''}>${plants.map(p => `<option value="${p.id}" ${r?.plantId === p.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select></label>
        <label class="field"><span>Asignada a</span><input id="rDev" list="devList" value="${esc(r?.assignedTo || '')}" placeholder="Todos los móviles"><datalist id="devList">${devNames.map(n => `<option value="${esc(n)}">`).join('')}</datalist></label>
        <label class="field"><span>Periodicidad</span><select id="rPer">${PERIODS.map(([v, n]) => `<option value="${v}" ${(r?.period ?? 30) === v ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
      </div>
      <label class="field"><span>Instrucciones para el operador</span><textarea id="rDesc" placeholder="p. ej. medir con la máquina en servicio normal">${esc(r?.description || '')}</textarea></label>
      <div class="field"><span>Puntos, en orden de recorrido</span><div id="rSel" class="list"></div></div>
      <div class="field"><span>Añadir puntos</span><div id="rAvail"></div></div>
      <div class="acts">${r ? '<button type="button" class="danger" id="rDel" style="margin-right:auto">Borrar ruta</button>' : ''}<button type="button" id="rCancel">Cancelar</button><button class="pri">Guardar</button></div>
    </form>`;
    const ptLabel = id => { const pt = points.find(x => x.id === id), m = machines.find(x => x.id === pt?.machineId); return pt ? `${esc(m?.name || '')} › ${pt.code ? esc(pt.code) + ' · ' : ''}${esc(pt.name)}` : '?'; };
    const draw = () => {
      const pid = $('#rPlant').value;
      $('#rSel').innerHTML = sel.length ? sel.map((id, i) => `<div class="item" style="cursor:default;padding:8px 10px">
          <b style="width:22px">${i+1}</b><div class="m" style="font-size:13.5px">${ptLabel(id)}</div>
          <button type="button" class="sm" data-up="${i}" ${i ? '' : 'disabled'}>↑</button><button type="button" class="sm" data-dn="${i}" ${i < sel.length-1 ? '' : 'disabled'}>↓</button><button type="button" class="sm danger" data-rm="${i}">✕</button></div>`).join('')
        : '<div class="hint">Ningún punto todavía. Añádelos abajo.</div>';
      const ms_ = machines.filter(m => m.plantId === pid).sort((a, b) => a.name.localeCompare(b.name));
      $('#rAvail').innerHTML = ms_.length ? ms_.map(m => {
        const pts = points.filter(x => x.machineId === m.id && !sel.includes(x.id)).sort((a, b) => (a.code || a.name).localeCompare(b.code || b.name));
        if (!pts.length) return '';
        return `<div style="margin:6px 0"><div style="display:flex;align-items:center;gap:8px"><b style="font-size:13.5px;flex:1">${esc(m.name)}</b><button type="button" class="sm" data-addm="${m.id}">+ todos</button></div>
          <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:4px">${pts.map(pt => `<button type="button" class="sm" data-add="${pt.id}">+ ${pt.code ? esc(pt.code) + ' · ' : ''}${esc(pt.name)}</button>`).join('')}</div></div>`;
      }).join('') || '<div class="hint">Todos los puntos de este barco están ya en la ruta.</div>'
        : '<div class="hint">Este barco no tiene máquinas con puntos. Créalos en Base de datos.</div>';
      $$('#rSel [data-up]').forEach(b => b.onclick = () => { const i = +b.dataset.up; [sel[i-1], sel[i]] = [sel[i], sel[i-1]]; draw(); });
      $$('#rSel [data-dn]').forEach(b => b.onclick = () => { const i = +b.dataset.dn; [sel[i+1], sel[i]] = [sel[i], sel[i+1]]; draw(); });
      $$('#rSel [data-rm]').forEach(b => b.onclick = () => { sel.splice(+b.dataset.rm, 1); draw(); });
      $$('#rAvail [data-add]').forEach(b => b.onclick = () => { sel.push(b.dataset.add); draw(); });
      $$('#rAvail [data-addm]').forEach(b => b.onclick = () => { points.filter(x => x.machineId === b.dataset.addm && !sel.includes(x.id)).sort((a, c) => (a.code || a.name).localeCompare(c.code || c.name)).forEach(x => sel.push(x.id)); draw(); });
    };
    $('#rPlant').onchange = () => { sel = []; draw(); };
    draw();
    let done = false;
    const finish = v => { if (done) return; done = true; d.close(); resolve(v); };
    $('#rCancel').onclick = () => finish(null);
    d.onclose = () => { if (!d.open) finish(null); };   // ignora el cierre retrasado de un diálogo anterior
    if (r) $('#rDel').onclick = async () => { if (confirmDel(`la ruta «${r.name}» y su historial de rondas (las medidas se conservan en sus puntos)`)) { await delRouteDeep(r.id); finish('del'); location.hash = '#/'; } };
    d.querySelector('form').onsubmit = async e => {
      e.preventDefault();
      if (!$('#rName').value.trim()) return;
      if (!sel.length) return alert('Añade al menos un punto a la ruta.');
      const o = r || { id: uid(), created: nowIso(), plantId: $('#rPlant').value };
      Object.assign(o, { name: $('#rName').value.trim(), period: +$('#rPer').value, description: $('#rDesc').value.trim(), points: sel, assignedTo: $('#rDev').value.trim() });
      await DB.put('routes', o);
      finish(o.id); location.hash = '#/r/' + o.id; route();
    };
    d.showModal();
  });
}

/* ---------------- Ejecución de una ronda ---------------- */
let roundCursor = {};   // roundId -> pointId seleccionado
async function vRound(id) {
  const rd = await DB.get('rounds', id); if (!rd) { location.hash = '#/'; return; }
  const r = await DB.get('routes', rd.routeId), p = await DB.get('plants', r.plantId);
  const machines = await DB.all('machines'), points = await DB.all('points');
  const pts = r.points.map(pid => points.find(x => x.id === pid)).filter(Boolean);
  const items = rd.items || (rd.items = {});
  const pending = pts.filter(pt => !items[pt.id]);
  const nDone = pts.length - pending.length;
  let curId = roundCursor[rd.id];
  if (!curId || !pts.some(x => x.id === curId)) curId = (pending[0] || pts[0])?.id;
  const cur = pts.find(x => x.id === curId), mach = machines.find(x => x.id === cur?.machineId);
  const it = items[curId];
  // medidas del punto (anterior a esta ronda)
  const hist = cur ? (await DB.by('measurements', 'pointId', cur.id)).sort(byWhen) : [];
  const thisMeas = it?.measId ? hist.find(x => x.id === it.measId) : null;
  const prevMeas = hist.find(x => x.id !== it?.measId && (!thisMeas || x.when < thisMeas.when))
    || (cur?.last && (!thisMeas || cur.last.when < thisMeas.when) ? cur.last : null);
  // rpm y carga sugeridas: otra medida de la misma máquina en esta ronda, si no la última del punto, si no la nominal
  let sugRpm = mach?.rpm ?? '', sugLoad = '';
  const sameMach = Object.entries(items).filter(([pid, v]) => v.status === 'done' && points.find(x => x.id === pid)?.machineId === cur?.machineId).map(([, v]) => v);
  if (sameMach.length) { const last = sameMach.sort((a, b) => (a.when < b.when ? 1 : -1))[0]; sugRpm = last.rpm ?? sugRpm; sugLoad = last.load ?? ''; }
  else if (hist[0]) { sugRpm = hist[0].rpm ?? sugRpm; sugLoad = hist[0].load ?? ''; }
  else if (cur?.last) { sugRpm = cur.last.rpm ?? sugRpm; sugLoad = cur.last.load ?? ''; }
  const o = cur?.orient || orientDefault, finished = !!rd.finished;
  const deltaHtml = (a, b) => {
    if (!a || !b) return '';
    return `<div class="dirs" style="margin-top:6px">${DIRS.filter(d => a.overall?.[d]).map(d => {
      const v = a.overall[d].v, pv = b.overall?.[d]?.v, ch = pv > 0 ? 100*(v/pv - 1) : null;
      const col = ch == null ? '--muted' : ch >= 50 ? '--err' : ch >= 25 ? '--warn' : '--ok';
      return `<span><span class="dot" style="background:var(${DCOL[d]})"></span>${d} <b>${fmt(v)}</b>${ch != null ? ` <span style="color:var(${col});font-weight:700">${ch >= 0 ? '+' : ''}${Math.round(ch)} %</span>` : ''}</span>`;
    }).join('')}<span class="hint">mm/s · cambio vs ${fday(b.when)}</span></div>`;
  };
  view.innerHTML = crumbs([['#/', 'Rutas'], ['#/r/' + r.id, r.name], [null, 'Ronda ' + fday(rd.started)]]) + `
    <div class="titlebar"><div><h2>${esc(r.name)}</h2><div class="sub">${esc(p?.name || '')} · ronda iniciada ${fdate(rd.started)}${finished ? ' · finalizada ' + fdate(rd.finished) : ''}${whoTxt(rd) ? ' · ' + esc(whoTxt(rd)) : ''}</div></div><span class="sp"></span><button class="sm adm" onclick="location.hash='#/inf/r/${rd.id}'">📄 Informe</button></div>
    <div class="card" style="margin-bottom:12px">
      <div style="display:flex;justify-content:space-between;font-size:13.5px;font-weight:600"><span>${nDone} de ${pts.length} puntos</span><span>${Math.round(100*nDone/Math.max(1, pts.length))} %</span></div>
      <div class="prog" style="display:block"><i style="width:${100*nDone/Math.max(1, pts.length)}%"></i></div>
    </div>
    <div class="grid two">
      <div class="col">
        ${cur ? `<div class="card" data-main="1" style="border-color:var(--acc)">
          <h3>Punto ${pts.indexOf(cur)+1} de ${pts.length}<span class="sp"></span>${it ? (it.status === 'done' ? '<span class="tag" style="color:var(--ok)">✓ medido</span>' : '<span class="tag" style="color:var(--warn)">saltado</span>') : ''}</h3>
          <div style="font-size:19px;font-weight:700;line-height:1.25">${esc(mach?.name || '')}</div>
          <div style="font-size:16px;margin-top:2px">${cur.code ? '<b>' + esc(cur.code) + '</b> · ' : ''}${esc(cur.name)}</div>
          <div class="hint" style="margin-top:4px">${esc(mach?.location || '')}${mach?.location ? ' · ' : ''}${esc(modeLabel(cur.cfg.mode))} · ${cur.cfg.navg} prom. · <b>${dirsTxt(cur.cfg.dirs)}</b></div>
          ${cur.notes ? `<p class="note" style="color:var(--fg)">${esc(cur.notes)}</p>` : ''}
          ${it?.status === 'done' && thisMeas ? `${alBox(evalAlarm(thisMeas.overall, cur, mach))}<div style="margin-top:12px">${deltaHtml(thisMeas, prevMeas)}</div>
              <div class="row" style="margin-top:12px"><button class="sm" type="button" onclick="location.hash='#/m/${thisMeas.id}'">Ver medida</button>${!finished ? '<button class="sm" id="bRedo">Repetir</button>' : ''}</div>`
            : it?.status === 'skip' ? `<p class="note">Saltado: <b>${esc(it.reason)}</b>${it.comment ? ' · ' + esc(it.comment) : ''}</p>${!finished ? '<button class="sm" id="bRedo">Medir ahora</button>' : ''}` : ''}
          ${!it && !finished ? `
            <div class="row" style="margin-top:12px">
              <label class="field"><span>Velocidad (rpm) *</span><input type="number" id="mRpm" inputmode="decimal" min="1" step="any" value="${sugRpm}"></label>
              <label class="field"><span>Carga (%) *</span><input type="number" id="mLoad" inputmode="decimal" min="0" max="150" step="any" value="${sugLoad}" placeholder="0–100"></label>
            </div>
            <div data-sec="sensor" data-title="📍 Posición del sensor" data-sumfn="orient">${orientHTML(o)}</div>
            <label class="field" style="margin-top:12px"><span>Nota</span><input id="mNote" placeholder="opcional"></label>
            <div style="margin-top:14px"><button class="pri big" id="bMeas">Medir</button></div>
            <div class="prog" id="prog"><i></i></div><div class="pmsg" id="pmsg"></div>
            <div class="row" style="margin-top:6px"><button class="sm" id="bSkip">Saltar punto…</button></div>` : ''}
          ${it && !finished && pending.length ? `<div style="margin-top:14px"><button class="pri big" id="bNext">Siguiente punto ›</button></div>` : ''}
          ${!finished && !pending.length ? `<div style="margin-top:14px"><button class="pri big" id="bFinish">Finalizar ronda</button></div>` : ''}
        </div>` : '<div class="empty">Esta ruta no tiene puntos.</div>'}
        ${!finished && pending.length && nDone ? '<div><button class="sm" id="bFinishEarly">Finalizar ronda sin completar…</button></div>' : ''}
      </div>
      <div class="col">
        <div class="card">
          <h3>Recorrido</h3>
          <div class="list">${pts.map((pt, i) => {
            const m = machines.find(x => x.id === pt.machineId), x = items[pt.id];
            const icon = x?.status === 'done' ? `<span style="color:var(${ALCOL[Math.max(0, x.alarm ?? 0)]});font-weight:800">${(x.alarm ?? 0) === 2 ? '⛔' : (x.alarm ?? 0) === 1 ? '⚠' : '✓'}</span>` : x?.status === 'skip' ? '<span style="color:var(--warn);font-weight:800">⤼</span>' : `<b>${i+1}</b>`;
            return `<div class="item" data-go="${pt.id}" style="${pt.id === curId ? 'border-color:var(--acc);' : ''}padding:10px 12px"><span style="width:22px;text-align:center">${icon}</span>
              <div class="m"><div class="t" style="font-size:14px">${esc(m?.name || '')} › ${pt.code ? esc(pt.code) + ' · ' : ''}${esc(pt.name)}</div>
              ${x?.status === 'done' ? `<div class="d">${fmt(x.vmax)} mm/s máx.${x.change != null ? ` · <span style="color:var(${x.change >= 50 ? '--err' : x.change >= 25 ? '--warn' : '--ok'})">${x.change >= 0 ? '+' : ''}${Math.round(x.change)} %</span>` : ''}</div>` : x?.status === 'skip' ? `<div class="d">Saltado: ${esc(x.reason)}</div>` : ''}</div></div>`;
          }).join('')}</div>
          <p class="note">Toca un punto para ir a él. El cambio en % es la velocidad global máxima respecto a la medida anterior del punto.</p>
        </div>
      </div>
    </div>`;
  if (cur && !it && !finished) bindOrient(o);
  $$('[data-go]').forEach(el => el.onclick = () => { roundCursor[rd.id] = el.dataset.go; route(); });
  const goNext = () => {
    const idx = pts.findIndex(x => x.id === curId);
    const nxt = pts.slice(idx + 1).find(x => !items[x.id]) || pts.find(x => !items[x.id]);
    roundCursor[rd.id] = nxt?.id || curId; route(); window.scrollTo(0, 0);
  };
  if ($('#bNext')) $('#bNext').onclick = goNext;
  if ($('#bRedo')) $('#bRedo').onclick = async () => { delete items[curId]; await DB.put('rounds', rd); route(); };
  const finishRound = async () => {
    rd.finished = nowIso(); await DB.put('rounds', rd); log(`Ronda «${r.name}» finalizada`, 'ok');
    if (isOp() && confirm('Ronda finalizada. ¿Enviar ahora las medidas a la oficina?')) { location.hash = '#/sync'; return; }
    route();
  };
  if ($('#bFinish')) $('#bFinish').onclick = finishRound;
  if ($('#bFinishEarly')) $('#bFinishEarly').onclick = async () => {
    if (!confirm(`Quedan ${pending.length} puntos sin medir. ¿Finalizar la ronda igualmente? Se marcarán como saltados.`)) return;
    for (const pt of pending) items[pt.id] = { status: 'skip', reason: 'No realizado', when: nowIso() };
    await finishRound();
  };
  if ($('#bSkip')) $('#bSkip').onclick = async () => {
    const v = await formDialog('Saltar punto', [
      { k: 'reason', label: 'Motivo', type: 'select', options: ['Máquina parada','Inaccesible','Fuera de servicio / en reparación','Condiciones no representativas','Otro'].map(x => [x, x]) },
      { k: 'comment', label: 'Comentario' }], {}, { okText: 'Saltar' });
    if (!v) return;
    items[curId] = { status: 'skip', reason: v.reason, comment: v.comment, when: nowIso() };
    await DB.put('rounds', rd); goNext();
  };
  setChip();
  if ($('#bMeas')) $('#bMeas').onclick = async () => {
    if (busy || !Sensor.connected()) return;
    const rpm = +$('#mRpm').value, load = $('#mLoad').value === '' ? NaN : +$('#mLoad').value;
    if (!(rpm > 0)) { $('#mRpm').focus(); return alert('Introduce las revoluciones (rpm) de la máquina.'); }
    if (!(load >= 0 && load <= 150)) { $('#mLoad').focus(); return alert('Introduce la carga en % (0–100).'); }
    const orient = readOrient();
    const meas = await runMeasure({ cfg: cur.cfg, orient, rpm, load, note: $('#mNote').value.trim(), pointId: cur.id, roundId: rd.id });
    if (!meas) return;
    if (!cur.orient?.fixed) cur.orient = orient;
    await DB.put('points', cur); await refreshPointLast(cur.id);
    const vmax = maxV(meas.overall), pv = maxV(prevMeas?.overall);
    items[cur.id] = { status: 'done', measId: meas.id, when: meas.when, rpm, load, vmax, change: pv > 0 ? 100*(vmax/pv - 1) : null, alarm: evalAlarm(meas.overall, cur, mach).level };
    await DB.put('rounds', rd);
    roundCursor[rd.id] = cur.id;   // quedarse en el punto para ver el resultado
    route(); window.scrollTo(0, 0);
  };
}


/* =====================================================================
   Modos y sincronización con OneDrive (oficina ⇄ móvil)
   ===================================================================== */
const defaultMode = () => (matchMedia('(pointer:coarse)').matches ? 'operador' : 'oficina');
const isOp = () => pref.get('mode', 'oficina') === 'operador';
function applyMode() { document.body.classList.toggle('op', isOp()); }
const devName = () => pref.get('device', '') || (isOp() ? 'movil' : 'oficina');
const opName = () => pref.get('operator', '');
const whoTxt = x => [x?.operator, x?.device].filter(Boolean).join(' · ');
// Codificación compacta de los bloques (Int16 → base64)
function i16ToB64(a) { const u = new Uint8Array(a.buffer, a.byteOffset, a.byteLength); let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return 'b64:' + btoa(s); }
function b64ToI16(s) { const b = atob(s.slice(4)), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return new Int16Array(u.buffer); }
const packDirs = dirs => Object.fromEntries(Object.entries(dirs).map(([d, bl]) => [d, bl.map(i16ToB64)]));
const unpackDirs = dirs => Object.fromEntries(Object.entries(dirs).map(([d, bl]) => [d, bl.map(b => typeof b === 'string' ? b64ToI16(b) : Int16Array.from(b))]));
const newer = (inc, cur) => !cur || (inc.updated || '') >= (cur.updated || '');
async function mergeRecords(store, list) {
  let n = 0;
  for (const o of list || []) { const cur = await DB.get(store, o.id); if (newer(o, cur)) { await DB.put(store, o, false); n++; } }
  return n;
}
const stampFile = () => new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-');

/* --- Plan (oficina → móvil) --- */
async function buildPlan() {
  const [plants, machines, points, routes] = await Promise.all(['plants','machines','points','routes'].map(s => DB.all(s)));
  for (const pt of points) {
    const ms = (await DB.by('measurements', 'pointId', pt.id)).sort(byWhen)[0];
    pt.last = ms ? { id: ms.id, when: ms.when, rpm: ms.rpm, load: ms.load, overall: ms.overall } : (pt.last || null);
  }
  for (const r of routes) {
    const done = (await DB.by('rounds', 'routeId', r.id)).filter(x => x.finished).sort((a, b) => (a.finished < b.finished ? 1 : -1))[0];
    if (done && (!r.lastDone || done.finished > r.lastDone)) r.lastDone = done.finished;
  }
  return { app: 'vibra8531', kind: 'plan', schema: 3, exported: nowIso(), from: devName(), plants, machines, points, routes, alarmTemplates: USER_TPLS };
}
async function importPlan(j) {
  if (j.app !== 'vibra8531' || j.kind !== 'plan') throw new Error('el archivo no es un plan de Vibra 8531');
  // en el móvil el plan manda: se sustituyen barcos, máquinas, puntos y rutas (las medidas y rondas se conservan)
  for (const st of ['plants','machines','points','routes']) {
    const keep = new Set((j[st] || []).map(x => x.id));
    for (const o of await DB.all(st)) if (!keep.has(o.id)) await DB.del(st, o.id);
    for (const o of j[st] || []) await DB.put(st, o, false);
  }
  if (j.alarmTemplates) { USER_TPLS = j.alarmTemplates; await saveTpls(); }
  pref.set('planInfo', { exported: j.exported, received: nowIso(), from: j.from, routes: (j.routes || []).length, points: (j.points || []).length });
  log(`Plan recibido: ${(j.routes || []).length} rutas, ${(j.points || []).length} puntos`, 'ok');
}

/* --- Datos (móvil → oficina) --- */
async function pendingData() {
  const ms = (await DB.all('measurements')).filter(x => !x.sent && !x.demo);
  const since = pref.get('lastSent', '');
  const rds = (await DB.all('rounds')).filter(x => (x.updated || x.started) > since);
  return { ms, rds };
}
async function buildData() {
  const { ms, rds } = await pendingData();
  return { file: { app: 'vibra8531', kind: 'datos', schema: 3, exported: nowIso(), from: devName(), operator: opName(),
                   measurements: ms.map(x => ({ ...x, dirs: packDirs(x.dirs) })), rounds: rds }, ms, rds };
}
async function markSent(ms) { for (const x of ms) { x.sent = nowIso(); await DB.put('measurements', x, false); } pref.set('lastSent', nowIso()); }
async function getDevices() { try { return (await DB.get('kv', 'devices'))?.list || {}; } catch (e) { return {}; } }
async function noteDevice(j, nm, nr) {
  const list = await getDevices(), k = j.from || 'desconocido', d = list[k] || { name: k, nMeas: 0, nRounds: 0 };
  d.operator = j.operator || d.operator || ''; d.lastExported = j.exported; d.lastImported = nowIso(); d.nMeas += nm; d.nRounds += nr;
  list[k] = d; await DB.put('kv', { id: 'devices', list }, false);
}
async function importData(j) {
  if (j.app !== 'vibra8531' || j.kind !== 'datos') throw new Error('el archivo no contiene medidas de Vibra 8531');
  const pts = new Set((await DB.all('points')).map(x => x.id));
  let nm = 0, orphan = 0; const touched = new Set();
  for (const o of j.measurements || []) {
    if (await DB.get('measurements', o.id)) continue;
    o.dirs = unpackDirs(o.dirs); delete o.sent;
    if (o.pointId && !pts.has(o.pointId)) { o.note = (o.note ? o.note + ' · ' : '') + 'punto desconocido en la oficina'; o.pointId = null; orphan++; }
    await DB.put('measurements', o, false); nm++;
    if (o.pointId) touched.add(o.pointId);
  }
  const nr = await mergeRecords('rounds', j.rounds);
  for (const pid of touched) await refreshPointLast(pid);
  await noteDevice(j, nm, nr);
  return { nm, nr, orphan };
}

/* --- Carpeta de OneDrive en el PC (File System Access API, Chrome/Edge) --- */
const FS = {
  ok: () => 'showDirectoryPicker' in window,
  async getHandle() { try { return await DB.get('kv', 'syncDir').then(x => x?.h); } catch (e) { return null; } },
  async setHandle(h) { await DB.put('kv', { id: 'syncDir', h }, false); },
  async perm(h, ask) {
    const o = { mode: 'readwrite' };
    if ((await h.queryPermission(o)) === 'granted') return true;
    return ask ? (await h.requestPermission(o)) === 'granted' : false;
  }
};
async function officeSync(h) {
  const out = { imported: [], nm: 0, nr: 0, orphan: 0, plan: null };
  const inDir = await h.getDirectoryHandle('desde_movil', { create: true });
  const outDir = await h.getDirectoryHandle('hacia_movil', { create: true });
  const done = new Set(pref.get('processed', []));
  for await (const [name, fh] of inDir.entries()) {
    if (fh.kind !== 'file' || !/\.(json|txt)$/i.test(name)) continue;
    const f = await fh.getFile(), key = `${name}|${f.size}|${f.lastModified}`;
    if (done.has(key)) continue;
    try {
      const r = await importData(JSON.parse(await f.text()));
      out.nm += r.nm; out.nr += r.nr; out.orphan += r.orphan; out.imported.push(name);
      done.add(key);
    } catch (e) { log(`No se pudo importar ${name}: ${e.message}`, 'warn'); }
  }
  pref.set('processed', [...done].slice(-500));
  const plan = await buildPlan();
  const w = await (await outDir.getFileHandle('vibra8531_plan.json', { create: true })).createWritable();
  await w.write(JSON.stringify(plan)); await w.close();
  out.plan = plan;
  pref.set('lastSync', { when: nowIso(), ...out, plan: { routes: plan.routes.length, points: plan.points.length } });
  log(`Sincronizado: ${out.nm} medidas y ${out.nr} rondas recibidas; plan publicado (${plan.routes.length} rutas)`, 'ok');
  return out;
}

async function vReport(kind, id) {

function download(name, text, type) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}
async function saveBackup() {
  const [plants, machines, points, measurements, routes, rounds] = await Promise.all(STORES.map(s => DB.all(s)));
  const out = { app: 'vibra8531', schema: 2, exported: nowIso(), plants, machines, points, routes, rounds, alarmTemplates: USER_TPLS,
    measurements: measurements.map(x => ({ ...x, dirs: Object.fromEntries(Object.entries(x.dirs).map(([d, bl]) => [d, bl.map(b => Array.from(b))])) })) };
  download(`vibra8531_${new Date().toISOString().slice(0,10)}.json`, JSON.stringify(out), 'application/json');
  log(`Copia guardada: ${plants.length} barcos, ${measurements.length} medidas`, 'ok');
}
function openBackup(file) {
  const rd = new FileReader();
  rd.onload = async () => {
    try {
      const j = JSON.parse(rd.result);
      if (j.app !== 'vibra8531') throw new Error('no es una copia de Vibra 8531');
      let n = 0;
      for (const s of ['plants','machines','points','routes','rounds']) for (const o of j[s] || []) { await DB.put(s, o, false); n++; }
      if (j.alarmTemplates) { for (const t of j.alarmTemplates) { const i = USER_TPLS.findIndex(x => x.id === t.id); if (i < 0) USER_TPLS.push(t); else if ((t.updated || '') >= (USER_TPLS[i].updated || '')) USER_TPLS[i] = t; } await saveTpls(); }
      for (const o of j.measurements || []) {
        o.dirs = Object.fromEntries(Object.entries(o.dirs).map(([d, bl]) => [d, bl.map(b => Int16Array.from(b))]));
        await DB.put('measurements', o, false); n++;
      }
      for (const pt of await DB.all('points')) await refreshPointLast(pt.id);
      alert(`Copia abierta: ${(j.measurements || []).length} medidas en ${(j.plants || []).length} barcos.`);
      location.hash = '#/'; route();
    } catch (e) { alert('No se pudo abrir la copia: ' + e.message); }
  };
  rd.readAsText(file);
}
function exportCSV(ms, pt, m, p) {
  const ds = DIRS.filter(d => ms.dirs[d]?.length);
  let s = `# Vibra 8531\n# Barco;${p?.name ?? '(medida libre)'}\n# Máquina;${m?.name ?? ''}\n# Punto;${pt ? (pt.code || '') + ' ' + pt.name : ''}\n# Nota;${ms.note || ''}\n# Fecha;${ms.when}\n# rpm;${ms.rpm ?? ''}\n# Carga %;${ms.load ?? ''}\n# Sensor;${orientText(ms.orient)}\n# Fs Hz;${ms.cfg.fs}\n\n`;
  s += `t_s,${ds.map(d => d + '_g').join(',')}\n`;
  for (let i = 0; i < N_TIME; i++) s += (i/ms.cfg.fs).toFixed(6) + ',' + ds.map(d => (ms.dirs[d][ms.dirs[d].length-1][i]/100).toFixed(2)).join(',') + '\n';
  s += `\nf_Hz,${ds.map(d => `${d}_mm_s_rms,${d}_g_rms`).join(',')}\n`;
  const sps = ds.map(d => getSpec(ms, d));
  for (let k = 0; k < sps[0].f.length; k++) s += sps[0].f[k].toFixed(4) + ',' + sps.map(sp => `${conv(sp.gpk[k], sp.f[k], 'vrms').toExponential(4)},${conv(sp.gpk[k], sp.f[k], 'grms').toExponential(4)}`).join(',') + '\n';
  download(`vibra8531_${(pt ? pt.code || pt.name : 'libre').replace(/\W+/g, '_')}_${ms.when.slice(0,16).replace(/[:T]/g, '-')}.csv`, s, 'text/csv');
}

/* =====================================================================
   Datos de ejemplo
   ===================================================================== */
function synth(fs, f1, a1, a2, seed) {
  const cg = new Int16Array(N_TIME); let r = seed;
  const rnd = () => (r = (r*16807) % 2147483647) / 2147483647;
  const ph = [rnd()*6.28, rnd()*6.28, rnd()*6.28];
  for (let i = 0; i < N_TIME; i++) {
    const t = i/fs;
    let v = a1*Math.sin(2*Math.PI*f1*t + ph[0]) + a2*Math.sin(2*Math.PI*2*f1*t + ph[1]) + 0.006*Math.sin(2*Math.PI*3*f1*t + ph[2]) + 0.01*Math.sin(2*Math.PI*100*t);
    v += 0.006*(rnd() + rnd() + rnd() - 1.5)*2;
    cg[i] = Math.round(v*100);
  }
  return cg;
}

    kin: [{ id: uid(), type: 'shaft', name: 'Defectos de eje', nh: 3, ratio: 1 },
          { id: uid(), type: 'ind', name: 'Motor', poles: 4, fl: 50, bars: 28, slots: 36, ratio: 1 },
          { id: uid(), type: 'bearing', name: 'Rodamiento 6309 LA', n: 8, bd: 17.46, pd: 72.5, ang: 0, ratio: 1 },
          { id: uid(), type: 'blades', name: 'Rodete', z: 6, ratio: 1 }] };
  await DB.put('machines', m);
  const pts = [
    { id: uid(), machineId: m.id, created: nowIso(), name: 'Motor lado acoplamiento', code: 'M1', cfg: { mode: 1, navg: 2, win: 1 }, orient: { pos: 'DE', z: '+V', x: '+H' } },
    { id: uid(), machineId: m.id, created: nowIso(), name: 'Motor lado libre', code: 'M2', cfg: { mode: 1, navg: 2, win: 1 }, orient: { pos: 'NDE', z: '+V', x: '+H', fixed: true } }];
  for (const pt of pts) await DB.put('points', pt);
  const fs = MODES[1];
  for (let k = 0; k < 6; k++) {
    for (const [j, pt] of pts.entries()) {
      const rpm = 1476 + Math.round(Math.random()*6), f1 = rpm/60, unb = 0.02 + 0.012*k*(j ? 0.5 : 1);
      const when = new Date(Date.now() - (5 - k)*30*864e5 - j*36e5).toISOString();
      const meas = { id: uid(), pointId: pt.id, when, rpm, load: 70 + Math.round(Math.random()*15), note: k === 5 ? 'Ruido algo mayor' : '', demo: true,
        orient: pt.orient, axisMap: orientMap(pt.orient), cfg: { mode: 1, fs, navg: 2, win: 1 }, quiet: true, unit: 'cg', sensor: { name: '8531 demo', fw: 'sintético' },
        dirs: { H: [synth(fs, f1, unb, 0.008, 11+k), synth(fs, f1, unb, 0.008, 21+k)], V: [synth(fs, f1, unb*0.6, 0.006, 31+k), synth(fs, f1, unb*0.6, 0.006, 41+k)], A: [synth(fs, f1, 0.008, 0.012 + 0.004*k, 51+k), synth(fs, f1, 0.008, 0.012 + 0.004*k, 61+k)] } };
      meas.overall = overallOf(meas);
      await DB.put('measurements', meas, false);
    }
  }
  const m2 = { id: uid(), plantId: p.id, created: nowIso(), name: 'Ventilador sala de máquinas', type: 'Ventilador', location: 'Cubierta 2, popa', rpm: 1450, kw: 11, alarmTpl: 'iso10816-1-I', notes: '' };
  await DB.put('machines', m2);
  const p3 = { id: uid(), machineId: m2.id, created: nowIso(), name: 'Motor lado libre', code: 'V1', cfg: { mode: 1, navg: 1, win: 1 }, orient: { pos: 'DE', z: '+V', x: '+H' } };
  await DB.put('points', p3);
  const rt = { id: uid(), plantId: p.id, created: nowIso(), name: 'Cámara de máquinas · mensual', period: 30, description: 'Medir con las máquinas en servicio normal, tras al menos 15 min funcionando.', points: [pts[0].id, pts[1].id, p3.id] };
  await DB.put('routes', rt);
  await DB.put('rounds', { id: uid(), routeId: rt.id, started: new Date(Date.now() - 34*864e5).toISOString(), finished: new Date(Date.now() - 34*864e5 + 3600e3).toISOString(),
    items: { [pts[0].id]: { status: 'done', when: nowIso() }, [pts[1].id]: { status: 'done', when: nowIso() }, [p3.id]: { status: 'skip', reason: 'Máquina parada', when: nowIso() } } });
  for (const pt of await DB.all('points')) await refreshPointLast(pt.id);
  for (const pt of pts) {   // la primera medida como referencia
    const first = (await DB.by('measurements', 'pointId', pt.id)).sort(byWhen).pop();
    if (first) { const x = await DB.get('points', pt.id); x.alarm = { ref: { id: first.id, when: first.when, rpm: first.rpm, load: first.load, overall: first.overall } }; await DB.put('points', x); }
  }
  log('Datos de ejemplo creados', 'ok');
}

/* =====================================================================
   Explorador GATT
   ===================================================================== */
const short = u => (u.startsWith('b614') || u.startsWith('0000')) ? u.slice(4,8) : u;
const needConn = () => { if (!Sensor.connected()) { log('Conecta primero el sensor', 'warn'); return true; } return false; };
async function allChars() {
  const out = [];
  for (const sv of await Sensor.q(() => Sensor.server.getPrimaryServices())) { try { out.push(...await Sensor.q(() => sv.getCharacteristics())); } catch (e) {} }
  return out;
}
async function listSvcs() {
  if (needConn()) return;
  const lines = (await allChars()).map(ch => { const p = ch.properties; return `${short(ch.service.uuid)}/${short(ch.uuid)}  [${[p.read && 'R', (p.write || p.writeWithoutResponse) && 'W', p.notify && 'N', p.indicate && 'I'].filter(Boolean).join('/')}]`; });
  for (const l of lines.reverse()) log(l);
  log('Servicios y características:', 'ok');
}
async function dumpAll() {
  if (needConn()) return;
  const lines = [];
  for (const ch of await allChars()) { if (!ch.properties.read) continue; try { const dv = await Sensor.q(() => ch.readValue()); lines.push(`${short(ch.uuid)} [${dv.byteLength} B]: ${hex(dv)}`); } catch (e) { lines.push(`${short(ch.uuid)}: ${e.message}`); } }
  for (const l of lines.reverse()) log(l);
  log('Volcado:', 'ok');
}
async function findChar(k) { k = k.trim().toLowerCase(); for (const ch of await allChars()) if (short(ch.uuid) === k || ch.uuid === k) return ch; throw new Error('No encontrada: ' + k); }
function parseHex(t) { const b = t.replace(/0x/gi,'').replace(/[^0-9a-f]/gi,''); if (b.length % 2) throw new Error('Hex impar'); return new Uint8Array((b.match(/../g) || []).map(x => parseInt(x,16))); }
async function xOp(write, read) {
  if (needConn()) return;
  try {
    const ch = await findChar($('#xCh').value);
    if (write) { const b = parseHex($('#xHex').value); await Sensor.q(() => Sensor._w(ch, b)); log(`ESCRIBIR ${short(ch.uuid)}: ${hex(new DataView(b.buffer))}`, 'ok'); if (read) await sleep(200); }
    if (read) { const dv = await Sensor.q(() => ch.readValue()); log(`LEER ${short(ch.uuid)} [${dv.byteLength} B]: ${hex(dv)}`); }
  } catch (e) { log(e.message, 'err'); }
}

/* =====================================================================
   Arranque
   ===================================================================== */
(async function init() {
  if (!navigator.bluetooth) view.insertAdjacentHTML('beforebegin', '<div class="warnbox" style="max-width:1168px;margin:12px auto 0">Este navegador no tiene Web Bluetooth: puedes revisar datos, pero para medir usa Chrome o Edge (Android, Windows, macOS) abriendo la página por https o desde localhost.</div>');
  try { await DB.open(); } catch (e) { view.innerHTML = `<div class="empty">No se pudo abrir la base de datos local: ${esc(e.message)}</div>`; return; }
  try { if (navigator.storage?.persist) await navigator.storage.persist(); } catch (e) {}
  if (!pref.get('mode', null)) pref.set('mode', defaultMode());   // se decide una vez y se guarda
  await loadTpls();
  if (!pref.get('migClass', false)) {   // la clase ISO pasa a ser el perfil de alarma de la máquina
    try {
      for (const m of await DB.all('machines')) if (m.iso != null || !m.alarmTpl) { if (!m.alarmTpl || !tplById(m.alarmTpl)) m.alarmTpl = 'iso10816-1-' + ['I','II','III','IV'][m.iso ?? 1]; delete m.iso; await DB.put('machines', m, false); }
      const fi = pref.get('freeIso', null); if (fi != null && !pref.get('freeTpl', null)) pref.set('freeTpl', 'iso10816-1-' + ['I','II','III','IV'][fi]);
      pref.set('migClass', true);
    } catch (e) { console.error(e); }
  }
  if (!pref.get('migFcut', false)) {   // corte inferior de 2 Hz en todas las medidas existentes
    try {
      for (const pt of await DB.all('points')) if (pt.cfg && pt.cfg.fcut == null) { pt.cfg.fcut = FCUT_DEF; await DB.put('points', pt, false); }
      pref.set('migBands', false);   // fuerza el recálculo de globales de abajo
      pref.set('migFcut', true);
    } catch (e) { console.error(e); }
  }
  if (!pref.get('migBands', false)) {   // añade las bandas normalizadas a las medidas existentes
    try {
      for (const x of await DB.all('measurements')) { if (x.dirs && Object.keys(x.dirs).length) { x.overall = overallOf(x); await DB.put('measurements', x, false); } }
      for (const pt of await DB.all('points')) {
        await refreshPointLast(pt.id);
        const p2 = await DB.get('points', pt.id);
        if (p2?.alarm?.ref?.id) { const r = await DB.get('measurements', p2.alarm.ref.id); if (r) { p2.alarm.ref.overall = r.overall; await DB.put('points', p2, false); } }
      }
      pref.set('migBands', true);
    } catch (e) { console.error(e); }
  }
  if (!isOp() && !pref.get('migLast', false)) { try { for (const pt of await DB.all('points')) await refreshPointLast(pt.id); pref.set('migLast', true); } catch (e) {} }
  applyMode(); setChip(); route();
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(e => log('Modo sin conexión no disponible: ' + e.message, 'warn'));
})();
</script>
