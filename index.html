<style>

--dH:#d9473b;--dV:#2f6fd6;--dA:#1d9a5b;--zA:#1d9a5b;--zB:#7fb33a;--zC:#e0a21b;--zD:#d9473b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1217;--card:#161b22;--fg:#e5e9ef;--muted:#8d97a6;--line:#29303a;--grid:#212831;--plot:#11161c;--ref:#5d6672;--dH:#ff6b5e;--dV:#5b9dff;--dA:#3ccf86}}
:root[data-theme="dark"]{--bg:#0e1217;--card:#161b22;--fg:#e5e9ef;--muted:#8d97a6;--line:#29303a;--grid:#212831;--plot:#11161c;--ref:#5d6672;--dH:#ff6b5e;--dV:#5b9dff;--dA:#3ccf86}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}

@media (min-width:980px){.grid.two{grid-template-columns:370px 1fr;align-items:start}}

select,input,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 8px;max-width:100%;min-width:0;width:100%}

table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}

tr.clk{cursor:pointer}tr.clk:hover td{background:var(--bg)}

dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--fg);padding:0;width:min(520px,94vw);max-height:90vh}
dialog::backdrop{background:rgba(0,0,0,.45)}

dialog h4{margin:0;font-size:17px}
dialog .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
.bottomnav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;z-index:10;padding-bottom:env(safe-area-inset-bottom)}

.bottomnav a.act{color:var(--acc)}
body.op .adm{display:none!important}
.badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--err);color:#fff;font-size:11px;line-height:18px;margin-left:3px}
.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-radius:12px;margin-bottom:12px;background:color-mix(in srgb,var(--acc2) 10%,var(--card));border:1px solid color-mix(in srgb,var(--acc2) 35%,transparent);font-size:14px}
.banner .m{flex:1;min-width:180px}
</style>

<body>
<header>
  <h1 onclick="location.hash='#/'">Vibra <b>8531</b></h1>

<script>
'use strict';
/* =====================================================================
   Utilidades
   ===================================================================== */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const G = 9.80665, N_TIME = 4096;
const MODES = [512,1024,2048,4096,8192,12288,16384,20480,24576,28672,32768,36864,40960,45056,49152,53248];
const DIRS = ['H','V','A'], DNAME = { H: 'Horizontal', V: 'Vertical', A: 'Axial' }, DCOL = { H: '--dH', V: '--dV', A: '--dA' };
const SAX = ['X','Y','Z'];
const ISO = [[0.71,1.8,4.5],[1.12,2.8,7.1],[1.8,4.5,11.2],[2.8,7.1,18]];
const ISO_NAME = ['I · pequeña (<15 kW)','II · media (15–75 kW)','III · grande, base rígida','IV · grande, base flexible'];
const ZCOL = ['--zA','--zB','--zC','--zD'];
const WIN_NAME = ['Rectangular','Hann','Flat-top'];
const MACH_TYPES = ['Motor eléctrico','Bomba','Ventilador','Compresor','Reductora','Motor diésel','Generador','Separadora','Otro'];
const hex = dv => Array.from(new Uint8Array(dv.buffer, dv.byteOffset, dv.byteLength), b => b.toString(16).padStart(2,'0')).join(' ');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Date.now().toString(36) + Math.random().toString(36).slice(2));
const nowIso = () => new Date().toISOString();
const fdate = iso => new Date(iso).toLocaleString([], { dateStyle: 'short', timeStyle: 'short' });
const fday = iso => new Date(iso).toLocaleDateString([], { dateStyle: 'medium' });
function fmt(v, d=3) {
  if (v == null || !isFinite(v)) return '–';
  const a = Math.abs(v);
  if (a !== 0 && (a >= 1e5 || a < 1e-3)) return v.toExponential(1);
  return String(parseFloat(v.toPrecision(d)));
}
function modeLabel(m) {
  const fs = MODES[m], t = 4096 / fs, n = ['Muy baja','Baja','Media','Amplia'][m];
  return `${n ? n + ' · ' : ''}0–${fmt(fs/2.56, 4)} Hz · Δf ${fmt(fs/4096, 3)} Hz · ${t >= 1 ? t + ' s' : (t*1000).toFixed(0) + ' ms'}`;
}
function log(msg, cls='') {
  const el = document.createElement('div'); if (cls) el.className = cls;
  el.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
  logBuf.unshift(el);
  if (logBuf.length > 400) logBuf.pop();
  const L = $('#log'); if (L) L.prepend(el.cloneNode(true));
}
const logBuf = [];
const pref = {
  get(k, d) { try { const v = localStorage.getItem('vibra8531.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('vibra8531.' + k, JSON.stringify(v)); } catch (e) {} }
};
const zoneOf = (v, cls) => { const l = ISO[cls ?? 1]; return v < l[0] ? 0 : v < l[1] ? 1 : v < l[2] ? 2 : 3; };
const zoneTag = (v, cls) => { if (v == null || !isFinite(v)) return ''; const z = zoneOf(v, cls); return `<span class="zone" style="background:var(${ZCOL[z]})">${'ABCD'[z]}</span>`; };

/* =====================================================================
   Base de datos local (IndexedDB) — diseño preparado para sincronizar
   ===================================================================== */
const APP_VERSION = '3.1';
const DB = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open('vibra8531', 3);
      r.onupgradeneeded = () => {
        const d = r.result;
        for (const [n, idx] of [['plants', null], ['machines', 'plantId'], ['points', 'machineId'], ['measurements', 'pointId'], ['routes', 'plantId'], ['rounds', 'routeId'], ['kv', null]]) {
          if (d.objectStoreNames.contains(n)) continue;
          const s = d.createObjectStore(n, { keyPath: 'id' }); if (idx) s.createIndex(idx, idx);
        }
      };
      r.onsuccess = () => { this.db = r.result; res(); };
      r.onerror = () => rej(r.error);
    });
  },
  _r(r) { return new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  _s(store, mode='readonly') { return this.db.transaction(store, mode).objectStore(store); },
  all(store) { return this._r(this._s(store).getAll()); },
  by(store, idx, v) { return this._r(this._s(store).index(idx).getAll(v)); },
  get(store, id) { return this._r(this._s(store).get(id)); },
  put(store, o, touch=true) { if (touch) o.updated = nowIso(); return this._r(this._s(store, 'readwrite').put(o)); },
  del(store, id) { return this._r(this._s(store, 'readwrite').delete(id)); },
  clear(store) { return this._r(this._s(store, 'readwrite').clear()); }
};
async function delMachineDeep(id) {
  for (const p of await DB.by('points', 'machineId', id)) await delPointDeep(p.id);
  await DB.del('machines', id);
}
async function delPointDeep(id) {
  for (const m of await DB.by('measurements', 'pointId', id)) await DB.del('measurements', m.id);
  for (const r of await DB.all('routes')) if (r.points.includes(id)) { r.points = r.points.filter(x => x !== id); await DB.put('routes', r); }
  await DB.del('points', id);
}
async function delRouteDeep(id) {
  for (const rd of await DB.by('rounds', 'routeId', id)) await DB.del('rounds', rd.id);
  await DB.del('routes', id);
}
async function delPlantDeep(id) {
  for (const m of await DB.by('machines', 'plantId', id)) await delMachineDeep(m.id);
  for (const r of await DB.by('routes', 'plantId', id)) await delRouteDeep(r.id);
  await DB.del('plants', id);
}
const byWhen = (a, b) => (a.when < b.when ? 1 : -1);
const STORES = ['plants','machines','points','measurements','routes','rounds'];

/* =====================================================================
   Capa del sensor (TE 8531N, firmware 4.x)
   ===================================================================== */
const U128 = h => 'b614' + h.toLowerCase() + '-b14a-40a6-b63f-0166f7868e13';
const STD = { '180F':0x180F, '181A':0x181A, '180A':0x180A, '2A19':0x2A19, '2A6E':0x2A6E, '2A24':0x2A24, '2A26':0x2A26, '2A27':0x2A27 };
const uuidOf = h => STD[h] ?? U128(h);
const CUSTOM_SVCS = ['B200','B300','B400','CD00','CE00','CF00','DA00','DD00','EE00','FA00','FC00'];

const Sensor = {
  device: null, server: null, chr: {}, Q: Promise.resolve(), expectingDisc: false, manual: false, info: {},
  onChange: () => {},
  q(fn) { const p = this.Q.then(fn); this.Q = p.catch(() => {}); return p; },
  connected() { return !!(this.device && this.device.gatt.connected); },
  async connect() {
    const optionalServices = [...CUSTOM_SVCS.map(U128), 0x180F, 0x181A, 0x180A];
    this.device = await navigator.bluetooth.requestDevice({ filters: [{ namePrefix: '85' }], optionalServices });
    this.device.addEventListener('gattserverdisconnected', () => this._onDisc());
    this.manual = false;
    await this.open();
  },
  async open() { this.chr = {}; this.server = await this.device.gatt.connect(); this.onChange(); },
  reconnect(tries=8) {
    // una sola reconexión a la vez, aunque la pidan varios sitios
    if (this._rc) return this._rc;
    this._rc = (async () => {
      try {
        for (let i = 0; i < tries; i++) {
          if (this.connected()) return;
          try { await this.open(); return; } catch (e) { await sleep(1500); }
        }
        throw new Error('No se pudo reconectar con el sensor');
      } finally { this._rc = null; }
    })();
    return this._rc;
  },
  /* Ejecuta una operación GATT; si la conexión se cae, reconecta y la reintenta */
  async op(fn, tries=3) {
    for (let i = 0; ; i++) {
      try {
        if (!this.connected()) await this.reconnect();
        return await fn();
      } catch (e) {
        const lost = !this.connected() || /disconnected|not connected|GATT operation failed|NetworkError/i.test(e.message);
        if (!lost || i >= tries - 1) throw e;
        this.chr = {};
        log('Conexión perdida durante una operación; reconectando…', 'warn');
        await sleep(800);
      }
    }
  },
  disconnect() { this.manual = true; if (this.connected()) this.device.gatt.disconnect(); this.onChange(); },
  _onDisc() {
    this.chr = {}; this.onChange();
    if (this.expectingDisc || this.manual) return;
    log('Conexión perdida; reintentando…', 'warn');
    this.reconnect(4).then(() => { log('Reconectado', 'ok'); this.onChange(); }).catch(e => log(e.message, 'err'));
  },
  async getChr(s, c) {
    const k = s + '/' + c;
    if (this.chr[k]) return this.chr[k];
    const sv = await this.server.getPrimaryService(uuidOf(s));
    return (this.chr[k] = await sv.getCharacteristic(uuidOf(c)));
  },
  _w(ch, b) { b = b instanceof Uint8Array ? b : new Uint8Array(b); return ch.writeValueWithResponse ? ch.writeValueWithResponse(b) : ch.writeValue(b); },
  read(s, c) { return this.q(() => this.op(async () => (await this.getChr(s, c)).readValue())); },
  write(s, c, b) { return this.q(() => this.op(async () => this._w(await this.getChr(s, c), b))); },
  async readInfo() {
    const td = new TextDecoder(), r = { name: this.device?.name || '' };
    for (const [k, c] of [['model','2A24'],['fw','2A26'],['hw','2A27']]) { try { r[k] = td.decode(await this.read('180A', c)); } catch (e) {} }
    return (this.info = r);
  },
  async status() {
    const r = {};
    try { r.battery = (await this.read('180F','2A19')).getUint8(0); } catch (e) {}
    try { const dv = await this.read('181A','2A6E'); let t = dv.getInt16(0,false)*0.01; if (t < -60 || t > 150) t = dv.getInt16(0,true)*0.01; r.temp = t; } catch (e) {}
    try { r.counter = (await this.read('B300','B301')).getUint16(0,false); } catch (e) {}
    return r;
  },
  /* FA10: escribir 00 → leer → reescribir completo. Confirma eje (FA01) y modo (byte 2). */
  async commit(axisCode, mode) {
    if (axisCode != null) await this.write('FA00','FA01',[axisCode]);
    await this.write('FA00','FA10',[0x00]);
    await sleep(350);
    const dv = await this.read('FA00','FA10');
    const b = Uint8Array.from(new Uint8Array(dv.buffer, dv.byteOffset, dv.byteLength));
    if (b.length < 3) throw new Error('Configuración FA10 inesperada: ' + hex(dv));
    if (mode != null) b[2] = mode;
    await this.write('FA00','FA10', b);
    await sleep(250);
    return (await this.read('FA00','FA10')).getUint8(2);
  },
  /* Mide un eje del sensor y devuelve Int16Array en cg */
  async measureAxis(code, mode, { quiet=true, block=120, onStage=()=>{}, onProg=()=>{}, onRec=()=>{} } = {}) {
    const acq = N_TIME / MODES[mode];
    onStage('Configurando');
    const m = await this.commit(code, mode);
    if (m !== mode) log(`El sensor quedó en modo ${m} (pedido ${mode})`, 'warn');
    await sleep(400);
    if (quiet) {
      this.expectingDisc = true;
      try {
        try { await this.write('B300','B303',[0x81]); } catch (e) {}

      const v = vals[f.k] ?? f.def ?? '', dis = f.disabled ? 'disabled' : '', req = f.req ? 'required' : '';

      else inp = `<input name="${f.k}" type="${f.type || 'text'}" value="${esc(v)}" ${f.type === 'number' ? `step="any" inputmode="decimal"` : ''} ${f.min != null ? `min="${f.min}"` : ''} ${f.max != null ? `max="${f.max}"` : ''} ${req} ${dis} ${f.ph ? `placeholder="${esc(f.ph)}"` : ''}>`;

    }).join('') + `<div class="acts">${danger ? `<button type="button" class="danger" id="dlgDel" style="margin-right:auto">${esc(danger)}</button>` : ''}<button type="button" id="dlgCancel">Cancelar</button><button class="pri" value="ok">${esc(okText)}</button></div></form>`;

const view = $('#view');
function crumbs(parts) {
  return `<nav class="crumbs">${parts.map(([href, t], i) => (i ? '<span class="sep">›</span>' : '') + (href ? `<a href="${href}">${esc(t)}</a>` : `<span>${esc(t)}</span>`)).join('')}</nav>`;
}
let freeView = false;
async function route() {
  const h = location.hash || '#/', [, kind, id] = h.split('/');
  const sect = !kind || ['r','ronda'].includes(kind) ? 'R' : kind === 'libre' ? 'L' : kind === 'ajustes' ? 'S' : kind === 'sync' ? 'Y' : 'A';
  for (const k of 'RLAYS') $('#nav' + k).classList.toggle('act', sect === k);
  applyMode(); updateSyncBadge();
  if (kind === 'm' && freeView) { $('#navA').classList.remove('act'); $('#navL').classList.add('act'); }
  try {
    if (!kind) await vRoutes();
    else if (kind === 'bd') await vPlants();
    else if (kind === 'r') await vRoute(id);
    else if (kind === 'ronda') await vRound(id);
    else if (kind === 'b') await vPlant(id);
    else if (kind === 'q') await vMachine(id);
    else if (kind === 'p') await vPoint(id);
    else if (kind === 'm') await vMeas(id);
    else if (kind === 'ajustes') await vSettings();
    else if (kind === 'libre') await vFree();
    else if (kind === 'sync') await vSync();
    else await vRoutes();
  } catch (e) { view.innerHTML = `<div class="empty">Error: ${esc(e.message)}</div>`; console.error(e); }
  setChip();
}

function orientHTML(o) {
  return `<div class="field" style="margin-top:12px"><span>Posición del sensor</span>

      <label class="field"><small>Z (perpendicular a la base) apunta en</small><select id="oZ">${DIRS.map(d => `<option value="${d}" ${o.z === d ? 'selected' : ''}>${DNAME[d]}</option>`).join('')}</select></label>
      <label class="field"><small>X (flecha de la base) apunta en</small><select id="oX"></select></label>
    </div>
    <div class="omap" id="oMap"></div></div>`;
}
function bindOrient(o) {
  const fillX = () => {
    const z = $('#oZ').value, cur = $('#oX').value || o.x;
    $('#oX').innerHTML = DIRS.filter(d => d !== z).map(d => `<option value="${d}" ${d === cur ? 'selected' : ''}>${DNAME[d]}</option>`).join('');
    const om = orientMap({ z, x: $('#oX').value });
    $('#oMap').innerHTML = 'Resultado: ' + SAX.map(a => `${a} → <b>${DNAME[om[a]]}</b>`).join(' · ');
  };
  $('#oZ').onchange = fillX; $('#oX').onchange = fillX; fillX();
}
/* Mide los 3 ejes con la configuración dada y guarda la medida (pointId null = medida libre) */
async function runMeasure({ cfg, orient, rpm, load, note, pointId, roundId }) {
  const om = orientMap(orient), fs = MODES[cfg.mode], quiet = pref.get('quiet', true), block = pref.get('blk', 120);
  const codes = { X: pref.get('codeX', 4), Y: pref.get('codeY', 2), Z: pref.get('codeZ', 1) };
  const meas = { id: uid(), pointId: pointId || null, roundId: roundId || null, when: nowIso(), rpm: rpm || null, load: load ?? null, note: note || '', orient, axisMap: om,
                 cfg: { mode: cfg.mode, fs, navg: cfg.navg, win: cfg.win }, quiet, unit: 'cg', dirs: {}, sensor: { ...Sensor.info } };
  const prog = (f, msg) => { $('#prog').style.display = f == null ? 'none' : 'block'; if (f != null) $('#prog i').style.width = (100*f).toFixed(1) + '%'; if (msg != null) $('#pmsg').textContent = msg; };
  const total = 3*cfg.navg; let step = 0;
  busy = true; setChip();
  try {
    try { const st = await Sensor.status(); meas.sensor.temp = st.temp; meas.sensor.battery = st.battery; } catch (e) {}
    for (let r = 0; r < cfg.navg; r++) for (const ax of SAX) {
      const d = om[ax], tag = `${DNAME[d]} (${ax})${cfg.navg > 1 ? ` · ${r+1}/${cfg.navg}` : ''}`;
      const cg = await Sensor.measureAxis(codes[ax], cfg.mode, { quiet, block,
        onStage: st => prog(step/total, `${tag}: ${st}…`), onProg: f => prog((step + f)/total), onRec: (on, acq) => recIndicator(on, acq) });
      (meas.dirs[d] ||= []).push(cg);
      step++;
    }
    meas.overall = overallOf(meas);
    await DB.put('measurements', meas, false);
    log(`Medida ${pointId ? 'guardada' : 'libre'}: ${DIRS.map(d => d + ' ' + fmt(meas.overall[d]?.v)).join(' · ')} mm/s`, 'ok');
    return meas;
  } catch (e) {
    log('Medida: ' + e.message, 'err'); prog(null, 'Error: ' + e.message + ' — la medida no se ha guardado.');
    return null;
  } finally { busy = false; recIndicator(false); setChip(); }
}
async function measurePoint(pt, mach) {
  if (busy || !Sensor.connected()) return;
  const rpm = +$('#mRpm').value, load = $('#mLoad').value === '' ? NaN : +$('#mLoad').value;
  if (!(rpm > 0)) { $('#mRpm').focus(); return alert('Introduce las revoluciones (rpm) de la máquina.'); }
  if (!(load >= 0 && load <= 150)) { $('#mLoad').focus(); return alert('Introduce la carga en % (0–100).'); }
  const orient = { z: $('#oZ').value, x: $('#oX').value };
  const meas = await runMeasure({ cfg: pt.cfg, orient, rpm, load, note: $('#mNote').value.trim(), pointId: pt.id });
  if (!meas) return;
  pt.orient = orient; await DB.put('points', pt);
  location.hash = '#/m/' + meas.id;
}

          <h3>Bandeja de medidas libres (${loose.length})<span class="sp"></span>${loose.length ? '<button class="sm danger" id="bClrAll">Descartar todas</button>' : ''}</h3>
          ${loose.length ? `<div class="list">${loose.map(x => `<a class="item" href="#/m/${x.id}"><div class="m">
              <div class="t">${fdate(x.when)}${x.note ? ' · ' + esc(x.note) : ''}</div>
              <div class="d">${x.rpm ? fmt(x.rpm, 5) + ' rpm' : 'sin rpm'} · ${esc(modeLabel(x.cfg.mode).split(' · ').slice(-3, -1).join(' · '))}</div>
              <div class="dirs" style="margin-top:4px">${DIRS.filter(d => x.overall?.[d]).map(d => `<span><span class="dot" style="background:var(${DCOL[d]})"></span>${d} <b>${fmt(x.overall[d].v)}</b></span>`).join('')}<span class="hint">mm/s</span></div>
            </div><span class="chev">›</span></a>`).join('')}</div>
            <p class="note">Las medidas libres se conservan aquí (también si cierras la app) hasta que las guardes en un punto o las descartes.</p>`
          : '<div class="empty">Aún no hay medidas libres.</div>'}
        </div>
      </div>
    </div>`;
  bindOrient(o);
  const saveCfg = () => {
    pref.set('freeCfg', { mode: +$('#fMode').value, navg: +$('#fNavg').value, win: +$('#fWin').value });
    pref.set('freeIso', +$('#fIso').value);
  };
  for (const id of ['#fMode','#fNavg','#fWin','#fIso']) $(id).onchange = saveCfg;
  if ($('#bClrAll')) $('#bClrAll').onclick = async () => {
    if (!confirmDel(`las ${loose.length} medidas libres de la bandeja`)) return;
    for (const x of loose) await DB.del('measurements', x.id);
    route();
  };
  setChip();
  $('#bMeas').onclick = async () => {
    if (busy || !Sensor.connected()) return;
    saveCfg();
    const rpm = +$('#mRpm').value || null, load = $('#mLoad').value === '' ? null : +$('#mLoad').value;
    const orient = { z: $('#oZ').value, x: $('#oX').value };
    pref.set('freeOrient', orient); pref.set('freeRpm', rpm);
    const meas = await runMeasure({ cfg: pref.get('freeCfg'), orient, rpm, load, note: $('#mNote').value.trim(), pointId: null });
    if (meas) location.hash = '#/m/' + meas.id;
  };
}

/* ---------------- Guardar una medida libre en un punto ---------------- */
async function saveToPoint(ms) {
  const plants = (await DB.all('plants')).sort((a, b) => a.name.localeCompare(b.name));
  const machines = await DB.all('machines'), points = await DB.all('points');
  const allMs = await DB.all('measurements');
  const nMeas = id => allMs.filter(x => x.pointId === id).length;
  const sameCfg = pt => pt.cfg.mode === ms.cfg.mode && pt.cfg.navg === ms.cfg.navg && pt.cfg.win === ms.cfg.win;
  const opt = (v, t, sel, dis) => `<option value="${esc(v)}" ${sel ? 'selected' : ''} ${dis ? 'disabled' : ''}>${esc(t)}</option>`;
  return new Promise(resolve => {
    const d = $('#dlg');
    d.innerHTML = `<form method="dialog">
      <h4>Guardar en un punto</h4>
      <p class="note" style="margin:0">Configuración de esta medida: ${esc(modeLabel(ms.cfg.mode))} · ${ms.cfg.navg} prom. · ${WIN_NAME[ms.cfg.win]}</p>
      <label class="field"><span>Barco</span><select id="sPlant"></select></label>
      <label class="field" id="wPlantNew" hidden><span>Nombre del barco nuevo *</span><input id="sPlantName"></label>
      <label class="field"><span>Máquina</span><select id="sMach"></select></label>
      <div id="wMachNew" hidden class="row">
        <label class="field" style="flex-basis:100%"><span>Nombre de la máquina nueva *</span><input id="sMachName" placeholder="p. ej. Ventilador sala de máquinas"></label>
        <label class="field"><span>Tipo</span><select id="sMachType">${MACH_TYPES.map(t => opt(t, t)).join('')}</select></label>
        <label class="field"><span>rpm nominal *</span><input type="number" id="sMachRpm" step="any" min="1" value="${ms.rpm ?? ''}"></label>
        <label class="field"><span>Clase ISO</span><select id="sMachIso">${ISO_NAME.map((n, i) => opt(i, n, i === pref.get('freeIso', 1))).join('')}</select></label>
      </div>
      <label class="field"><span>Punto</span><select id="sPt"></select><small id="sPtHint"></small></label>
      <div id="wPtNew" hidden class="row">
        <label class="field" style="flex-basis:60%"><span>Nombre del punto nuevo *</span><input id="sPtName" placeholder="p. ej. Motor lado acoplamiento"></label>
        <label class="field"><span>Código</span><input id="sPtCode" placeholder="M1"></label>
      </div>
      <div class="row">
        <label class="field"><span>Velocidad (rpm) *</span><input type="number" id="sRpm" step="any" min="1" value="${ms.rpm ?? ''}"></label>
        <label class="field"><span>Carga (%) *</span><input type="number" id="sLoad" step="any" min="0" max="150" value="${ms.load ?? ''}"></label>
      </div>
      <div class="acts"><button type="button" id="sCancel">Cancelar</button><button class="pri" id="sOk">Guardar</button></div>
    </form>`;
    const fillPlants = () => { $('#sPlant').innerHTML = plants.map((p, i) => opt(p.id, p.name, i === 0)).join('') + opt('__new', '➕ Nuevo barco…', !plants.length); onPlant(); };
    const onPlant = () => {
      const pid = $('#sPlant').value; $('#wPlantNew').hidden = pid !== '__new';
      const ms_ = machines.filter(m => m.plantId === pid).sort((a, b) => a.name.localeCompare(b.name));
      $('#sMach').innerHTML = ms_.map((m, i) => opt(m.id, m.name, i === 0)).join('') + opt('__new', '➕ Nueva máquina…', !ms_.length);
      onMach();
    };
    const onMach = () => {
      const mid = $('#sMach').value; $('#wMachNew').hidden = mid !== '__new';
      const pts = points.filter(x => x.machineId === mid).sort((a, b) => (a.code || a.name).localeCompare(b.code || b.name));
      let firstOk = null;
      const html = pts.map(pt => {
        const n = nMeas(pt.id), ok = !n || sameCfg(pt);
        if (ok && !firstOk) firstOk = pt.id;
        return opt(pt.id, `${pt.code ? pt.code + ' · ' : ''}${pt.name}${ok ? '' : ' (otra configuración)'}`, false, !ok);
      }).join('');
      $('#sPt').innerHTML = html + opt('__new', '➕ Nuevo punto…', false);
      $('#sPt').value = firstOk || '__new';
      onPt();
    };
    const onPt = () => {
      const v = $('#sPt').value; $('#wPtNew').hidden = v !== '__new';
      const pt = points.find(x => x.id === v);
      $('#sPtHint').textContent = v === '__new' ? 'Se creará con la configuración de esta medida y quedará bloqueada.'
        : pt && !nMeas(pt.id) && !sameCfg(pt) ? 'El punto aún no tiene medidas: se le asignará la configuración de esta medida.'
        : 'Misma configuración: las medidas serán comparables.';
    };
    $('#sPlant').onchange = onPlant; $('#sMach').onchange = onMach; $('#sPt').onchange = onPt;
    fillPlants();
    let done = false;
    const finish = v => { if (done) return; done = true; d.close(); resolve(v); };
    $('#sCancel').onclick = () => finish(null);
    d.onclose = () => finish(null);
    d.querySelector('form').onsubmit = async e => {
      e.preventDefault();
      const need = (cond, el, msg) => { if (cond) return false; alert(msg); el?.focus(); return true; };
      const rpm = +$('#sRpm').value, load = $('#sLoad').value === '' ? NaN : +$('#sLoad').value;
      let pid = $('#sPlant').value, mid = $('#sMach').value, ptid = $('#sPt').value;
      if (pid === '__new' && need($('#sPlantName').value.trim(), $('#sPlantName'), 'Pon nombre al barco nuevo.')) return;
      if (mid === '__new' && need($('#sMachName').value.trim(), $('#sMachName'), 'Pon nombre a la máquina nueva.')) return;
      if (mid === '__new' && need(+$('#sMachRpm').value > 0, $('#sMachRpm'), 'Indica las rpm nominales de la máquina.')) return;
      if (ptid === '__new' && need($('#sPtName').value.trim(), $('#sPtName'), 'Pon nombre al punto nuevo.')) return;
      if (need(rpm > 0, $('#sRpm'), 'Indica las rpm de la medida.')) return;
      if (need(load >= 0 && load <= 150, $('#sLoad'), 'Indica la carga en % (0–100).')) return;
      if (pid === '__new') { const p = { id: uid(), created: nowIso(), name: $('#sPlantName').value.trim(), code: '', notes: '' }; await DB.put('plants', p); pid = p.id; }
      if (mid === '__new') { const m = { id: uid(), plantId: pid, created: nowIso(), name: $('#sMachName').value.trim(), type: $('#sMachType').value, location: '', rpm: +$('#sMachRpm').value, kw: null, iso: +$('#sMachIso').value, notes: '' }; await DB.put('machines', m); mid = m.id; }
      if (ptid === '__new') {
        const pt = { id: uid(), machineId: mid, created: nowIso(), name: $('#sPtName').value.trim(), code: $('#sPtCode').value.trim(), notes: '', cfg: { mode: ms.cfg.mode, navg: ms.cfg.navg, win: ms.cfg.win }, orient: ms.orient };
        await DB.put('points', pt); ptid = pt.id;
      } else {
        const pt = await DB.get('points', ptid);
        if (!nMeas(ptid) && !sameCfg(pt)) { pt.cfg = { mode: ms.cfg.mode, navg: ms.cfg.navg, win: ms.cfg.win }; }
        pt.orient = ms.orient; await DB.put('points', pt);
      }
      ms.pointId = ptid; ms.rpm = rpm; ms.load = load;
      await DB.put('measurements', ms, false);
      log('Medida libre guardada en un punto', 'ok');
      finish(ptid);
    };
    d.showModal();
  });
}

/* ---------------- Medida ---------------- */
let mvState = { dir: null, ref: '', unit: 'vrms', yscale: 'lin' };
function getSpec(meas, d) {
  const k = meas.id + '|' + d;
  if (!specCache.has(k)) { specCache.set(k, spectrum(meas.dirs[d], meas.cfg.fs, meas.cfg.win)); if (specCache.size > 60) specCache.delete(specCache.keys().next().value); }
  return specCache.get(k);
}

      </div>
      <div class="col">
        <div class="card">

    </div>`;
  $('#unit').value = mvState.unit; $('#yscale').value = mvState.yscale; $('#ref').value = mvState.ref;
  const plotS = new Plot($('#cvS'), { xlab: 'Frecuencia (Hz)', xfmt: x => fmt(x, 5) + ' Hz', tipExtra: f => f1 ? `  · ${(f/f1).toFixed(2)}×` : '' });
  const plotT = new Plot($('#cvT'), { xlab: 'Tiempo (s)', ylab: 'g', yunit: 'g', xfmt: x => fmt(x, 5) + ' s' });
  let refMeas = mvState.ref ? await DB.get('measurements', mvState.ref) : null;
  const render = () => {
    const d = mvState.dir, sp = getSpec(ms, d), unit = mvState.unit, ov = ms.overall?.[d] || overallOf(ms)[d];
    const y = Float64Array.from(sp.gpk, (v, k) => conv(v, sp.f[k], unit));
    const a1 = f1 ? orderAmp(sp.f, Float64Array.from(sp.gpk, (v, k) => conv(v, sp.f[k], 'vrms')), f1, sp.df) : null;
    $('#kpis').innerHTML = `
      <div class="kpi"><div class="l">Velocidad global</div><div class="v">${fmt(ov.v)}<small>mm/s</small></div><div class="s">${zoneTag(ov.v, cls)} 10–${fmt(Math.min(1000, fmax), 4)} Hz</div></div>
      <div class="kpi"><div class="l">Aceleración RMS</div><div class="v">${fmt(ov.arms)}<small>g</small></div><div class="s">${fmt(ov.arms*G, 3)} m/s²</div></div>
      <div class="kpi"><div class="l">Aceleración pico</div><div class="v">${fmt(ov.apk)}<small>g</small></div><div class="s">Factor de cresta ${fmt(ov.cf, 2)}</div></div>
      <div class="kpi"><div class="l">1×${f1 ? ' · ' + fmt(f1, 4) + ' Hz' : ''}</div><div class="v">${fmt(a1?.y)}<small>mm/s</small></div><div class="s">${a1 ? 'pico en ' + fmt(a1.f, 4) + ' Hz' : 'sin rpm'}</div></div>`;
    plotS.ylab = UNIT[unit]; plotS.yunit = unit === 'vrms' ? 'mm/s' : 'g';
    plotS.logY = mvState.yscale === 'log'; plotS.zeroBase = !plotS.logY;
    plotS.series = [{ name: refMeas ? fday(ms.when) : '', x: sp.f, y, color: DCOL[d] }];
    if (refMeas && refMeas.dirs[d]?.length) {
      const rs = getSpec(refMeas, d);
      plotS.series.push({ name: fday(refMeas.when), x: rs.f, y: Float64Array.from(rs.gpk, (v, k) => conv(v, rs.f[k], unit)), color: '--ref', width: 1.6, dash: [4,3] });
    }

      const v = vals[j], r = rvals?.[j];

    }).join('');
    // picos
    const [x0, x1] = plotS.range() || [0, fmax];
    const pk = findPeaks(sp.f, y, Math.max(x0, unit === 'vrms' ? 5 : 2), Math.min(x1, fmax));
    $('#tPk').innerHTML = `<tr><th>#</th><th>Hz</th><th>${UNIT[unit]}</th><th>Orden</th></tr>` + pk.map((k, j) => `<tr><td>${j+1}</td><td>${fmt(sp.f[k], 4)}</td><td>${fmt(y[k])}</td><td>${f1 ? (sp.f[k]/f1).toFixed(2) + '×' : '–'}</td></tr>`).join('');
    // tiempo

    plotT.series = [{ x: Float64Array.from(cg, (_, k) => k/ms.cfg.fs), y: Float64Array.from(cg, v => (v - mean)/100), color: DCOL[d] }];

  plotS.onzoom = () => setTimeout(render, 0);

  $$('[data-z]').forEach(b => b.onclick = () => { plotS.xr = b.dataset.z === '10' && f1 ? [0, Math.min(10.5*f1, fmax)] : null; render(); });

}

const DAY = 864e5;
const PERIODS = [[7,'Semanal'],[14,'Quincenal'],[30,'Mensual'],[60,'Bimestral'],[90,'Trimestral'],[180,'Semestral'],[365,'Anual']];
const periodName = d => (PERIODS.find(p => p[0] === d) || [0, `Cada ${d} días`])[1];
async function routeState(r) {
  const rounds = (await DB.by('rounds', 'routeId', r.id)).sort((a, b) => (a.started < b.started ? 1 : -1));
  const open = rounds.find(x => !x.finished);
  let lastDone = rounds.filter(x => x.finished).sort((a, b) => (a.finished < b.finished ? 1 : -1))[0];
  if (r.lastDone && (!lastDone || r.lastDone > lastDone.finished)) lastDone = { finished: r.lastDone };   // dato de la oficina
  const due = lastDone ? Date.parse(lastDone.finished) + r.period*DAY : null;
  const days = due == null ? null : Math.ceil((due - Date.now())/DAY);
  let st;
  if (open) st = { cls: '--acc2', txt: 'En curso' };
  else if (!lastDone) st = { cls: '--warn', txt: 'Nunca realizada' };
  else if (days < 0) st = { cls: '--err', txt: `Vencida hace ${-days} día${days === -1 ? '' : 's'}` };
  else if (days <= Math.max(2, Math.round(r.period*0.15))) st = { cls: '--warn', txt: days === 0 ? 'Vence hoy' : `Vence en ${days} día${days === 1 ? '' : 's'}` };
  else st = { cls: '--ok', txt: `Al día · próxima ${new Date(due).toLocaleDateString([], { day: 'numeric', month: 'short' })}` };
  return { rounds, open, lastDone, due, days, st };
}
const roundProgress = (rd, r) => { const done = r.points.filter(id => rd.items?.[id]).length; return { done, total: r.points.length }; };
const stTag = st => `<span class="tag" style="background:color-mix(in srgb,var(${st.cls}) 16%,transparent);color:var(${st.cls})">${esc(st.txt)}</span>`;

/* ---------------- Lista de rutas (pantalla del operador) ---------------- */
async function vRoutes() {
  const routes = await DB.all('routes'), plants = await DB.all('plants');
  const rows = [];
  for (const r of routes) rows.push({ r, s: await routeState(r), p: plants.find(x => x.id === r.plantId) });
  const rank = x => x.s.open ? 0 : x.s.days == null ? 1 : x.s.days < 0 ? 2 : 3;
  rows.sort((a, b) => rank(a) - rank(b) || (a.s.days ?? 0) - (b.s.days ?? 0) || a.r.name.localeCompare(b.r.name));
  view.innerHTML = `
    <div class="titlebar"><div><h2>Rutas</h2><div class="sub">Tareas programadas de medida</div></div><span class="sp"></span>${plants.length ? '<button class="pri adm" id="bNew">+ Ruta</button>' : ''}</div>
    ${isOp() ? await opBanner() : ''}
    <div class="list">${rows.length ? rows.map(({ r, s: st, p }) => {
      const pr = st.open ? roundProgress(st.open, r) : null;
      return `<a class="item" href="#/r/${r.id}"><div class="m">
        <div class="t">${esc(r.name)}</div>
        <div class="d">${esc(p?.name || '¿barco borrado?')} · ${r.points.length} punto${r.points.length === 1 ? '' : 's'} · ${periodName(r.period)}${st.lastDone ? ' · última ' + fday(st.lastDone.finished) : ''}</div>
        <div style="margin-top:6px">${stTag(st.st)}${pr ? ` <span class="hint">${pr.done}/${pr.total} puntos</span>` : ''}</div>
      </div><span class="chev">›</span></a>`;
    }).join('') : `<div class="empty">${isOp() ? 'No hay rutas en este móvil.<br><br><button class="pri" onclick="location.hash=\'#/sync\'">Recibir el plan de la oficina</button>' : plants.length
        ? 'Aún no hay rutas. Una ruta es una lista ordenada de puntos que se mide periódicamente.<br><br><button class="pri" id="bNew2">Crear la primera ruta</button>'
        : 'Primero crea en <a href="#/bd">Base de datos</a> los barcos, máquinas y puntos.<br><span class="hint">o carga unos datos de ejemplo en Ajustes</span>'}</div>`}</div>`;
  const nb = () => editRoute(null);
  if ($('#bNew')) $('#bNew').onclick = nb; if ($('#bNew2')) $('#bNew2').onclick = nb;
}

/* ---------------- Editor de ruta ---------------- */
async function editRoute(r) {
  const plants = (await DB.all('plants')).sort((a, b) => a.name.localeCompare(b.name));
  const machines = await DB.all('machines'), points = await DB.all('points');
  let sel = r ? [...r.points] : [];
  return new Promise(resolve => {
    const d = $('#dlg');
    d.innerHTML = `<form method="dialog">
      <h4>${r ? 'Editar ruta' : 'Nueva ruta'}</h4>
      <label class="field"><span>Nombre *</span><input id="rName" required value="${esc(r?.name || '')}" placeholder="p. ej. Cámara de máquinas · mensual"></label>
      <div class="row">
        <label class="field"><span>Barco</span><select id="rPlant" ${r ? 'disabled' : ''}>${plants.map(p => `<option value="${p.id}" ${r?.plantId === p.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select></label>
        <label class="field"><span>Periodicidad</span><select id="rPer">${PERIODS.map(([v, n]) => `<option value="${v}" ${(r?.period ?? 30) === v ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
      </div>
      <label class="field"><span>Instrucciones para el operador</span><textarea id="rDesc" placeholder="p. ej. medir con la máquina en servicio normal">${esc(r?.description || '')}</textarea></label>
      <div class="field"><span>Puntos, en orden de recorrido</span><div id="rSel" class="list"></div></div>
      <div class="field"><span>Añadir puntos</span><div id="rAvail"></div></div>
      <div class="acts">${r ? '<button type="button" class="danger" id="rDel" style="margin-right:auto">Borrar ruta</button>' : ''}<button type="button" id="rCancel">Cancelar</button><button class="pri">Guardar</button></div>
    </form>`;
    const ptLabel = id => { const pt = points.find(x => x.id === id), m = machines.find(x => x.id === pt?.machineId); return pt ? `${esc(m?.name || '')} › ${pt.code ? esc(pt.code) + ' · ' : ''}${esc(pt.name)}` : '?'; };
    const draw = () => {
      const pid = $('#rPlant').value;
      $('#rSel').innerHTML = sel.length ? sel.map((id, i) => `<div class="item" style="cursor:default;padding:8px 10px">
          <b style="width:22px">${i+1}</b><div class="m" style="font-size:13.5px">${ptLabel(id)}</div>
          <button type="button" class="sm" data-up="${i}" ${i ? '' : 'disabled'}>↑</button><button type="button" class="sm" data-dn="${i}" ${i < sel.length-1 ? '' : 'disabled'}>↓</button><button type="button" class="sm danger" data-rm="${i}">✕</button></div>`).join('')
        : '<div class="hint">Ningún punto todavía. Añádelos abajo.</div>';
      const ms_ = machines.filter(m => m.plantId === pid).sort((a, b) => a.name.localeCompare(b.name));
      $('#rAvail').innerHTML = ms_.length ? ms_.map(m => {
        const pts = points.filter(x => x.machineId === m.id && !sel.includes(x.id)).sort((a, b) => (a.code || a.name).localeCompare(b.code || b.name));
        if (!pts.length) return '';
        return `<div style="margin:6px 0"><div style="display:flex;align-items:center;gap:8px"><b style="font-size:13.5px;flex:1">${esc(m.name)}</b><button type="button" class="sm" data-addm="${m.id}">+ todos</button></div>
          <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:4px">${pts.map(pt => `<button type="button" class="sm" data-add="${pt.id}">+ ${pt.code ? esc(pt.code) + ' · ' : ''}${esc(pt.name)}</button>`).join('')}</div></div>`;
      }).join('') || '<div class="hint">Todos los puntos de este barco están ya en la ruta.</div>'
        : '<div class="hint">Este barco no tiene máquinas con puntos. Créalos en Base de datos.</div>';
      $$('#rSel [data-up]').forEach(b => b.onclick = () => { const i = +b.dataset.up; [sel[i-1], sel[i]] = [sel[i], sel[i-1]]; draw(); });
      $$('#rSel [data-dn]').forEach(b => b.onclick = () => { const i = +b.dataset.dn; [sel[i+1], sel[i]] = [sel[i], sel[i+1]]; draw(); });
      $$('#rSel [data-rm]').forEach(b => b.onclick = () => { sel.splice(+b.dataset.rm, 1); draw(); });
      $$('#rAvail [data-add]').forEach(b => b.onclick = () => { sel.push(b.dataset.add); draw(); });
      $$('#rAvail [data-addm]').forEach(b => b.onclick = () => { points.filter(x => x.machineId === b.dataset.addm && !sel.includes(x.id)).sort((a, c) => (a.code || a.name).localeCompare(c.code || c.name)).forEach(x => sel.push(x.id)); draw(); });
    };
    $('#rPlant').onchange = () => { sel = []; draw(); };
    draw();
    let done = false;
    const finish = v => { if (done) return; done = true; d.close(); resolve(v); };
    $('#rCancel').onclick = () => finish(null);
    d.onclose = () => finish(null);
    if (r) $('#rDel').onclick = async () => { if (confirmDel(`la ruta «${r.name}» y su historial de rondas (las medidas se conservan en sus puntos)`)) { await delRouteDeep(r.id); finish('del'); location.hash = '#/'; } };
    d.querySelector('form').onsubmit = async e => {
      e.preventDefault();
      if (!$('#rName').value.trim()) return;
      if (!sel.length) return alert('Añade al menos un punto a la ruta.');
      const o = r || { id: uid(), created: nowIso(), plantId: $('#rPlant').value };
      Object.assign(o, { name: $('#rName').value.trim(), period: +$('#rPer').value, description: $('#rDesc').value.trim(), points: sel });
      await DB.put('routes', o);
      finish(o.id); location.hash = '#/r/' + o.id; route();
    };
    d.showModal();
  });
}

  const p = await DB.get('plants', r.plantId), machines = await DB.all('machines'), points = await DB.all('points');

            const pt = points.find(x => x.id === pid), m = machines.find(x => x.id === pt?.machineId), last = lastByPt[pid], ov = last?.overall;
            return `<a class="item" href="#/p/${pid}"><b style="width:22px">${i+1}</b><div class="m"><div class="t">${esc(m?.name || '')} › ${pt?.code ? esc(pt.code) + ' · ' : ''}${esc(pt?.name || '?')}</div>
              <div class="d">${last ? 'última medida ' + fday(last.when) : 'sin medidas'}</div>
              ${ov ? `<div class="dirs" style="margin-top:4px">${DIRS.filter(d => ov[d]).map(d => `<span><span class="dot" style="background:var(${DCOL[d]})"></span>${d} <b>${fmt(ov[d].v)}</b></span>`).join('')}<span class="hint">mm/s</span> ${zoneTag(maxV(ov), m?.iso)}</div>` : ''}</div><span class="chev">›</span></a>`;
          }).join('')}</div>

  $('#bEdit').onclick = () => editRoute(r);

    location.hash = '#/ronda/' + rd.id;

  $$('tr[data-rd]').forEach(tr => tr.onclick = () => location.hash = '#/ronda/' + tr.dataset.rd);

/* ---------------- Ejecución de una ronda ---------------- */
let roundCursor = {};   // roundId -> pointId seleccionado
async function vRound(id) {
  const rd = await DB.get('rounds', id); if (!rd) { location.hash = '#/'; return; }
  const r = await DB.get('routes', rd.routeId), p = await DB.get('plants', r.plantId);
  const machines = await DB.all('machines'), points = await DB.all('points');
  const pts = r.points.map(pid => points.find(x => x.id === pid)).filter(Boolean);
  const items = rd.items || (rd.items = {});
  const pending = pts.filter(pt => !items[pt.id]);
  const nDone = pts.length - pending.length;
  let curId = roundCursor[rd.id];
  if (!curId || !pts.some(x => x.id === curId)) curId = (pending[0] || pts[0])?.id;
  const cur = pts.find(x => x.id === curId), mach = machines.find(x => x.id === cur?.machineId);
  const it = items[curId];
  // medidas del punto (anterior a esta ronda)
  const hist = cur ? (await DB.by('measurements', 'pointId', cur.id)).sort(byWhen) : [];
  const thisMeas = it?.measId ? hist.find(x => x.id === it.measId) : null;
  const prevMeas = hist.find(x => x.id !== it?.measId && (!thisMeas || x.when < thisMeas.when))
    || (cur?.last && (!thisMeas || cur.last.when < thisMeas.when) ? cur.last : null);
  // rpm y carga sugeridas: otra medida de la misma máquina en esta ronda, si no la última del punto, si no la nominal
  let sugRpm = mach?.rpm ?? '', sugLoad = '';
  const sameMach = Object.entries(items).filter(([pid, v]) => v.status === 'done' && points.find(x => x.id === pid)?.machineId === cur?.machineId).map(([, v]) => v);
  if (sameMach.length) { const last = sameMach.sort((a, b) => (a.when < b.when ? 1 : -1))[0]; sugRpm = last.rpm ?? sugRpm; sugLoad = last.load ?? ''; }
  else if (hist[0]) { sugRpm = hist[0].rpm ?? sugRpm; sugLoad = hist[0].load ?? ''; }
  else if (cur?.last) { sugRpm = cur.last.rpm ?? sugRpm; sugLoad = cur.last.load ?? ''; }
  const o = cur?.orient || orientDefault, finished = !!rd.finished;
  const deltaHtml = (a, b) => {
    if (!a || !b) return '';
    return `<div class="dirs" style="margin-top:6px">${DIRS.filter(d => a.overall?.[d]).map(d => {
      const v = a.overall[d].v, pv = b.overall?.[d]?.v, ch = pv > 0 ? 100*(v/pv - 1) : null;
      const col = ch == null ? '--muted' : ch >= 50 ? '--err' : ch >= 25 ? '--warn' : '--ok';
      return `<span><span class="dot" style="background:var(${DCOL[d]})"></span>${d} <b>${fmt(v)}</b>${ch != null ? ` <span style="color:var(${col});font-weight:700">${ch >= 0 ? '+' : ''}${Math.round(ch)} %</span>` : ''}</span>`;
    }).join('')}<span class="hint">mm/s · cambio vs ${fday(b.when)}</span></div>`;
  };
  view.innerHTML = crumbs([['#/', 'Rutas'], ['#/r/' + r.id, r.name], [null, 'Ronda ' + fday(rd.started)]]) + `
    <div class="titlebar"><div><h2>${esc(r.name)}</h2><div class="sub">${esc(p?.name || '')} · ronda iniciada ${fdate(rd.started)}${finished ? ' · finalizada ' + fdate(rd.finished) : ''}</div></div></div>
    <div class="card" style="margin-bottom:12px">
      <div style="display:flex;justify-content:space-between;font-size:13.5px;font-weight:600"><span>${nDone} de ${pts.length} puntos</span><span>${Math.round(100*nDone/Math.max(1, pts.length))} %</span></div>
      <div class="prog" style="display:block"><i style="width:${100*nDone/Math.max(1, pts.length)}%"></i></div>
    </div>
    <div class="grid two">
      <div class="col">
        ${cur ? `<div class="card" style="border-color:var(--acc)">
          <h3>Punto ${pts.indexOf(cur)+1} de ${pts.length}<span class="sp"></span>${it ? (it.status === 'done' ? '<span class="tag" style="color:var(--ok)">✓ medido</span>' : '<span class="tag" style="color:var(--warn)">saltado</span>') : ''}</h3>
          <div style="font-size:19px;font-weight:700;line-height:1.25">${esc(mach?.name || '')}</div>
          <div style="font-size:16px;margin-top:2px">${cur.code ? '<b>' + esc(cur.code) + '</b> · ' : ''}${esc(cur.name)}</div>
          <div class="hint" style="margin-top:4px">${esc(mach?.location || '')}${mach?.location ? ' · ' : ''}${esc(modeLabel(cur.cfg.mode))} · ${cur.cfg.navg} prom.</div>
          ${cur.notes ? `<p class="note" style="color:var(--fg)">${esc(cur.notes)}</p>` : ''}
          ${it?.status === 'done' && thisMeas ? `<div style="margin-top:12px">${deltaHtml(thisMeas, prevMeas)}</div>
              <div class="row" style="margin-top:12px"><button class="sm" type="button" onclick="location.hash='#/m/${thisMeas.id}'">Ver medida</button>${!finished ? '<button class="sm" id="bRedo">Repetir</button>' : ''}</div>`
            : it?.status === 'skip' ? `<p class="note">Saltado: <b>${esc(it.reason)}</b>${it.comment ? ' · ' + esc(it.comment) : ''}</p>${!finished ? '<button class="sm" id="bRedo">Medir ahora</button>' : ''}` : ''}
          ${!it && !finished ? `
            <div class="row" style="margin-top:12px">
              <label class="field"><span>Velocidad (rpm) *</span><input type="number" id="mRpm" inputmode="decimal" min="1" step="any" value="${sugRpm}"></label>
              <label class="field"><span>Carga (%) *</span><input type="number" id="mLoad" inputmode="decimal" min="0" max="150" step="any" value="${sugLoad}" placeholder="0–100"></label>
            </div>
            ${orientHTML(o)}
            <label class="field" style="margin-top:12px"><span>Nota</span><input id="mNote" placeholder="opcional"></label>
            <div style="margin-top:14px"><button class="pri big" id="bMeas">Medir</button></div>
            <div class="prog" id="prog"><i></i></div><div class="pmsg" id="pmsg"></div>
            <div class="row" style="margin-top:6px"><button class="sm" id="bSkip">Saltar punto…</button></div>` : ''}
          ${it && !finished && pending.length ? `<div style="margin-top:14px"><button class="pri big" id="bNext">Siguiente punto ›</button></div>` : ''}
          ${!finished && !pending.length ? `<div style="margin-top:14px"><button class="pri big" id="bFinish">Finalizar ronda</button></div>` : ''}
        </div>` : '<div class="empty">Esta ruta no tiene puntos.</div>'}
        ${!finished && pending.length && nDone ? '<div><button class="sm" id="bFinishEarly">Finalizar ronda sin completar…</button></div>' : ''}
      </div>
      <div class="col">
        <div class="card">
          <h3>Recorrido</h3>
          <div class="list">${pts.map((pt, i) => {
            const m = machines.find(x => x.id === pt.machineId), x = items[pt.id];
            const icon = x?.status === 'done' ? '<span style="color:var(--ok);font-weight:800">✓</span>' : x?.status === 'skip' ? '<span style="color:var(--warn);font-weight:800">⤼</span>' : `<b>${i+1}</b>`;
            return `<div class="item" data-go="${pt.id}" style="${pt.id === curId ? 'border-color:var(--acc);' : ''}padding:10px 12px"><span style="width:22px;text-align:center">${icon}</span>
              <div class="m"><div class="t" style="font-size:14px">${esc(m?.name || '')} › ${pt.code ? esc(pt.code) + ' · ' : ''}${esc(pt.name)}</div>
              ${x?.status === 'done' ? `<div class="d">${fmt(x.vmax)} mm/s máx.${x.change != null ? ` · <span style="color:var(${x.change >= 50 ? '--err' : x.change >= 25 ? '--warn' : '--ok'})">${x.change >= 0 ? '+' : ''}${Math.round(x.change)} %</span>` : ''}</div>` : x?.status === 'skip' ? `<div class="d">Saltado: ${esc(x.reason)}</div>` : ''}</div></div>`;
          }).join('')}</div>
          <p class="note">Toca un punto para ir a él. El cambio en % es la velocidad global máxima respecto a la medida anterior del punto.</p>
        </div>
      </div>
    </div>`;
  if (cur && !it && !finished) bindOrient(o);
  $$('[data-go]').forEach(el => el.onclick = () => { roundCursor[rd.id] = el.dataset.go; route(); });
  const goNext = () => {
    const idx = pts.findIndex(x => x.id === curId);
    const nxt = pts.slice(idx + 1).find(x => !items[x.id]) || pts.find(x => !items[x.id]);
    roundCursor[rd.id] = nxt?.id || curId; route(); window.scrollTo(0, 0);
  };
  if ($('#bNext')) $('#bNext').onclick = goNext;
  if ($('#bRedo')) $('#bRedo').onclick = async () => { delete items[curId]; await DB.put('rounds', rd); route(); };
  const finishRound = async () => {
    rd.finished = nowIso(); await DB.put('rounds', rd); log(`Ronda «${r.name}» finalizada`, 'ok');
    if (isOp() && confirm('Ronda finalizada. ¿Enviar ahora las medidas a la oficina?')) { location.hash = '#/sync'; return; }
    route();
  };
  if ($('#bFinish')) $('#bFinish').onclick = finishRound;
  if ($('#bFinishEarly')) $('#bFinishEarly').onclick = async () => {
    if (!confirm(`Quedan ${pending.length} puntos sin medir. ¿Finalizar la ronda igualmente? Se marcarán como saltados.`)) return;
    for (const pt of pending) items[pt.id] = { status: 'skip', reason: 'No realizado', when: nowIso() };
    await finishRound();
  };
  if ($('#bSkip')) $('#bSkip').onclick = async () => {
    const v = await formDialog('Saltar punto', [
      { k: 'reason', label: 'Motivo', type: 'select', options: ['Máquina parada','Inaccesible','Fuera de servicio / en reparación','Condiciones no representativas','Otro'].map(x => [x, x]) },
      { k: 'comment', label: 'Comentario' }], {}, { okText: 'Saltar' });
    if (!v) return;
    items[curId] = { status: 'skip', reason: v.reason, comment: v.comment, when: nowIso() };
    await DB.put('rounds', rd); goNext();
  };
  setChip();
  if ($('#bMeas')) $('#bMeas').onclick = async () => {
    if (busy || !Sensor.connected()) return;
    const rpm = +$('#mRpm').value, load = $('#mLoad').value === '' ? NaN : +$('#mLoad').value;
    if (!(rpm > 0)) { $('#mRpm').focus(); return alert('Introduce las revoluciones (rpm) de la máquina.'); }
    if (!(load >= 0 && load <= 150)) { $('#mLoad').focus(); return alert('Introduce la carga en % (0–100).'); }
    const orient = { z: $('#oZ').value, x: $('#oX').value };
    const meas = await runMeasure({ cfg: cur.cfg, orient, rpm, load, note: $('#mNote').value.trim(), pointId: cur.id, roundId: rd.id });
    if (!meas) return;
    cur.orient = orient; await DB.put('points', cur);
    const vmax = maxV(meas.overall), pv = maxV(prevMeas?.overall);
    items[cur.id] = { status: 'done', measId: meas.id, when: meas.when, rpm, load, vmax, change: pv > 0 ? 100*(vmax/pv - 1) : null };
    await DB.put('rounds', rd);
    roundCursor[rd.id] = cur.id;   // quedarse en el punto para ver el resultado
    route(); window.scrollTo(0, 0);
  };
}


/* =====================================================================
   Modos y sincronización con OneDrive (oficina ⇄ móvil)
   ===================================================================== */
const defaultMode = () => (matchMedia('(pointer:coarse)').matches ? 'operador' : 'oficina');
const isOp = () => pref.get('mode', 'oficina') === 'operador';
function applyMode() { document.body.classList.toggle('op', isOp()); }
const devName = () => pref.get('device', '') || (isOp() ? 'movil' : 'oficina');
// Codificación compacta de los bloques (Int16 → base64)
function i16ToB64(a) { const u = new Uint8Array(a.buffer, a.byteOffset, a.byteLength); let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return 'b64:' + btoa(s); }
function b64ToI16(s) { const b = atob(s.slice(4)), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return new Int16Array(u.buffer); }
const packDirs = dirs => Object.fromEntries(Object.entries(dirs).map(([d, bl]) => [d, bl.map(i16ToB64)]));
const unpackDirs = dirs => Object.fromEntries(Object.entries(dirs).map(([d, bl]) => [d, bl.map(b => typeof b === 'string' ? b64ToI16(b) : Int16Array.from(b))]));
const newer = (inc, cur) => !cur || (inc.updated || '') >= (cur.updated || '');
async function mergeRecords(store, list) {
  let n = 0;
  for (const o of list || []) { const cur = await DB.get(store, o.id); if (newer(o, cur)) { await DB.put(store, o, false); n++; } }
  return n;
}
const stampFile = () => new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-');

/* --- Plan (oficina → móvil) --- */
async function buildPlan() {
  const [plants, machines, points, routes] = await Promise.all(['plants','machines','points','routes'].map(s => DB.all(s)));
  for (const pt of points) {
    const ms = (await DB.by('measurements', 'pointId', pt.id)).sort(byWhen)[0];
    pt.last = ms ? { id: ms.id, when: ms.when, rpm: ms.rpm, load: ms.load, overall: ms.overall } : (pt.last || null);
  }
  for (const r of routes) {
    const done = (await DB.by('rounds', 'routeId', r.id)).filter(x => x.finished).sort((a, b) => (a.finished < b.finished ? 1 : -1))[0];
    if (done && (!r.lastDone || done.finished > r.lastDone)) r.lastDone = done.finished;
  }
  return { app: 'vibra8531', kind: 'plan', schema: 3, exported: nowIso(), from: devName(), plants, machines, points, routes };
}
async function importPlan(j) {
  if (j.app !== 'vibra8531' || j.kind !== 'plan') throw new Error('el archivo no es un plan de Vibra 8531');
  // en el móvil el plan manda: se sustituyen barcos, máquinas, puntos y rutas (las medidas y rondas se conservan)
  for (const st of ['plants','machines','points','routes']) {
    const keep = new Set((j[st] || []).map(x => x.id));
    for (const o of await DB.all(st)) if (!keep.has(o.id)) await DB.del(st, o.id);
    for (const o of j[st] || []) await DB.put(st, o, false);
  }
  pref.set('planInfo', { exported: j.exported, received: nowIso(), from: j.from, routes: (j.routes || []).length, points: (j.points || []).length });
  log(`Plan recibido: ${(j.routes || []).length} rutas, ${(j.points || []).length} puntos`, 'ok');
}

/* --- Datos (móvil → oficina) --- */
async function pendingData() {
  const ms = (await DB.all('measurements')).filter(x => !x.sent && !x.demo);
  const since = pref.get('lastSent', '');
  const rds = (await DB.all('rounds')).filter(x => (x.updated || x.started) > since);
  return { ms, rds };
}
async function buildData() {
  const { ms, rds } = await pendingData();
  return { file: { app: 'vibra8531', kind: 'datos', schema: 3, exported: nowIso(), from: devName(),
                   measurements: ms.map(x => ({ ...x, dirs: packDirs(x.dirs) })), rounds: rds }, ms, rds };
}
async function markSent(ms) { for (const x of ms) { x.sent = nowIso(); await DB.put('measurements', x, false); } pref.set('lastSent', nowIso()); }
async function importData(j) {
  if (j.app !== 'vibra8531' || j.kind !== 'datos') throw new Error('el archivo no contiene medidas de Vibra 8531');
  const pts = new Set((await DB.all('points')).map(x => x.id));
  let nm = 0, orphan = 0;
  for (const o of j.measurements || []) {
    if (await DB.get('measurements', o.id)) continue;
    o.dirs = unpackDirs(o.dirs); delete o.sent;
    if (o.pointId && !pts.has(o.pointId)) { o.note = (o.note ? o.note + ' · ' : '') + 'punto desconocido en la oficina'; o.pointId = null; orphan++; }
    await DB.put('measurements', o, false); nm++;
  }
  const nr = await mergeRecords('rounds', j.rounds);
  return { nm, nr, orphan };
}
async function updateSyncBadge() {
  const a = $('#navY'); if (!a) return;
  let n = 0;
  if (isOp()) { try { n = (await pendingData()).ms.length; } catch (e) {} }
  a.innerHTML = (isOp() ? 'Enviar' : 'Sincronizar') + (n ? `<span class="badge">${n}</span>` : '');
}
async function opBanner() {
  const { ms } = await pendingData(), pi = pref.get('planInfo', null);
  if (ms.length) return `<div class="banner"><div class="m"><b>${ms.length} medida${ms.length === 1 ? '' : 's'} sin enviar</b> a la oficina.</div><button class="pri sm" onclick="location.hash='#/sync'">Enviar</button></div>`;
  if (pi) return `<div class="hint" style="margin:-4px 0 10px">Plan de la oficina del ${fday(pi.exported)}. <a href="#/sync">Actualizar</a></div>`;
  return '';
}

/* --- Carpeta de OneDrive en el PC (File System Access API, Chrome/Edge) --- */
const FS = {
  ok: () => 'showDirectoryPicker' in window,
  async getHandle() { try { return await DB.get('kv', 'syncDir').then(x => x?.h); } catch (e) { return null; } },
  async setHandle(h) { await DB.put('kv', { id: 'syncDir', h }, false); },
  async perm(h, ask) {
    const o = { mode: 'readwrite' };
    if ((await h.queryPermission(o)) === 'granted') return true;
    return ask ? (await h.requestPermission(o)) === 'granted' : false;
  }
};
async function officeSync(h) {
  const out = { imported: [], nm: 0, nr: 0, orphan: 0, plan: null };
  const inDir = await h.getDirectoryHandle('desde_movil', { create: true });
  const outDir = await h.getDirectoryHandle('hacia_movil', { create: true });
  const done = new Set(pref.get('processed', []));
  for await (const [name, fh] of inDir.entries()) {
    if (fh.kind !== 'file' || !name.toLowerCase().endsWith('.json')) continue;
    const f = await fh.getFile(), key = `${name}|${f.size}|${f.lastModified}`;
    if (done.has(key)) continue;
    try {
      const r = await importData(JSON.parse(await f.text()));
      out.nm += r.nm; out.nr += r.nr; out.orphan += r.orphan; out.imported.push(name);
      done.add(key);
    } catch (e) { log(`No se pudo importar ${name}: ${e.message}`, 'warn'); }
  }
  pref.set('processed', [...done].slice(-500));
  const plan = await buildPlan();
  const w = await (await outDir.getFileHandle('vibra8531_plan.json', { create: true })).createWritable();
  await w.write(JSON.stringify(plan)); await w.close();
  out.plan = plan;
  pref.set('lastSync', { when: nowIso(), ...out, plan: { routes: plan.routes.length, points: plan.points.length } });
  log(`Sincronizado: ${out.nm} medidas y ${out.nr} rondas recibidas; plan publicado (${plan.routes.length} rutas)`, 'ok');
  return out;
}

          <p class="note">Protocolo firmware 4.x: FA01 = canal → FA10 (escribir 00, leer, reescribir; byte 2 = modo) → B303 = 0x81 (sin BLE) o 0x01 → DA03 [canal, índice BE, nº] → int16 BE en cg.</p>
        </div>
        <div class="card">
          <h3>Registro<span class="sp"></span><button class="sm" id="bCopy">Copiar</button></h3>
          <pre id="log"></pre>
        </div>
      </div>
    </div>`;
  $('#log').replaceChildren(...logBuf.map(e => e.cloneNode(true)));
  if ($('#bStat')) $('#bStat').onclick = async () => { Sensor.lastStatus = await Sensor.status(); route(); };
  $('#quiet').onchange = () => pref.set('quiet', $('#quiet').checked);
  $('#devName').onchange = () => pref.set('device', $('#devName').value.trim());
  $$('#modeSeg button').forEach(b => b.onclick = () => {
    const m = b.dataset.m; if (m === pref.get('mode', 'oficina')) return;
    if (m === 'oficina' && !confirm('El modo Oficina permite editar la base de datos y las rutas. ¿Cambiar?')) return;
    if (m === 'operador' && !confirm('En modo Operador se ocultan la base de datos, la edición de rutas y las opciones técnicas. ¿Cambiar?')) return;
    pref.set('mode', m); route();
  });
  for (const k of ['codeX','codeY','codeZ','blk']) $('#' + k).onchange = () => pref.set(k, +$('#' + k).value);
  $('#bSave').onclick = saveBackup;
  $('#bOpen').onclick = () => $('#fOpen').click();
  $('#fOpen').onchange = e => { if (e.target.files[0]) openBackup(e.target.files[0]); e.target.value = ''; };
  $('#bSample').onclick = async () => { await makeSample(); location.hash = '#/'; };
  $('#bWipe').onclick = async () => {
    if (!confirm('¿Borrar TODOS los barcos, máquinas, puntos y medidas de este dispositivo?')) return;
    if (prompt('Escribe BORRAR para confirmar') !== 'BORRAR') return;
    for (const s of STORES) await DB.clear(s);
    route();
  };
  $('#bDiag').onclick = listSvcs; $('#bDump').onclick = dumpAll;
  $('#bXr').onclick = () => xOp(false, true); $('#bXw').onclick = () => xOp(true, false); $('#bXwr').onclick = () => xOp(true, true);
  $('#bCopy').onclick = () => navigator.clipboard?.writeText(logBuf.map(e => e.textContent).reverse().join('\n')).then(() => log('Registro copiado', 'ok'));
}

/* =====================================================================
   Copia de seguridad (formato preparado para sincronizar)
   ===================================================================== */
function download(name, text, type) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}
async function saveBackup() {
  const [plants, machines, points, measurements, routes, rounds] = await Promise.all(STORES.map(s => DB.all(s)));
  const out = { app: 'vibra8531', schema: 2, exported: nowIso(), plants, machines, points, routes, rounds,
    measurements: measurements.map(x => ({ ...x, dirs: Object.fromEntries(Object.entries(x.dirs).map(([d, bl]) => [d, bl.map(b => Array.from(b))])) })) };
  download(`vibra8531_${new Date().toISOString().slice(0,10)}.json`, JSON.stringify(out), 'application/json');
  log(`Copia guardada: ${plants.length} barcos, ${measurements.length} medidas`, 'ok');
}
function openBackup(file) {
  const rd = new FileReader();
  rd.onload = async () => {
    try {
      const j = JSON.parse(rd.result);
      if (j.app !== 'vibra8531') throw new Error('no es una copia de Vibra 8531');
      let n = 0;
      for (const s of ['plants','machines','points','routes','rounds']) for (const o of j[s] || []) { await DB.put(s, o, false); n++; }
      for (const o of j.measurements || []) {
        o.dirs = Object.fromEntries(Object.entries(o.dirs).map(([d, bl]) => [d, bl.map(b => Int16Array.from(b))]));
        await DB.put('measurements', o, false); n++;
      }
      alert(`Copia abierta: ${(j.measurements || []).length} medidas en ${(j.plants || []).length} barcos.`);
      location.hash = '#/'; route();
    } catch (e) { alert('No se pudo abrir la copia: ' + e.message); }
  };
  rd.readAsText(file);
}
function exportCSV(ms, pt, m, p) {
  const ds = DIRS.filter(d => ms.dirs[d]?.length);
  let s = `# Vibra 8531\n# Barco;${p?.name ?? '(medida libre)'}\n# Máquina;${m?.name ?? ''}\n# Punto;${pt ? (pt.code || '') + ' ' + pt.name : ''}\n# Nota;${ms.note || ''}\n# Fecha;${ms.when}\n# rpm;${ms.rpm ?? ''}\n# Carga %;${ms.load ?? ''}\n# Sensor;${orientText(ms.orient)}\n# Fs Hz;${ms.cfg.fs}\n\n`;
  s += `t_s,${ds.map(d => d + '_g').join(',')}\n`;
  for (let i = 0; i < N_TIME; i++) s += (i/ms.cfg.fs).toFixed(6) + ',' + ds.map(d => (ms.dirs[d][ms.dirs[d].length-1][i]/100).toFixed(2)).join(',') + '\n';
  s += `\nf_Hz,${ds.map(d => `${d}_mm_s_rms,${d}_g_rms`).join(',')}\n`;
  const sps = ds.map(d => getSpec(ms, d));
  for (let k = 0; k < sps[0].f.length; k++) s += sps[0].f[k].toFixed(4) + ',' + sps.map(sp => `${conv(sp.gpk[k], sp.f[k], 'vrms').toExponential(4)},${conv(sp.gpk[k], sp.f[k], 'grms').toExponential(4)}`).join(',') + '\n';
  download(`vibra8531_${(pt ? pt.code || pt.name : 'libre').replace(/\W+/g, '_')}_${ms.when.slice(0,16).replace(/[:T]/g, '-')}.csv`, s, 'text/csv');
}

/* =====================================================================
   Datos de ejemplo
   ===================================================================== */
function synth(fs, f1, a1, a2, seed) {
  const cg = new Int16Array(N_TIME); let r = seed;
  const rnd = () => (r = (r*16807) % 2147483647) / 2147483647;
  const ph = [rnd()*6.28, rnd()*6.28, rnd()*6.28];
  for (let i = 0; i < N_TIME; i++) {
    const t = i/fs;
    let v = a1*Math.sin(2*Math.PI*f1*t + ph[0]) + a2*Math.sin(2*Math.PI*2*f1*t + ph[1]) + 0.006*Math.sin(2*Math.PI*3*f1*t + ph[2]) + 0.01*Math.sin(2*Math.PI*100*t);
    v += 0.006*(rnd() + rnd() + rnd() - 1.5)*2;
    cg[i] = Math.round(v*100);
  }
  return cg;
}
async function makeSample() {
  const p = { id: uid(), created: nowIso(), name: 'Buque de ejemplo', code: 'IMO 0000000', notes: 'Datos sintéticos para probar la app' };
  await DB.put('plants', p);
  const m = { id: uid(), plantId: p.id, created: nowIso(), name: 'Bomba de lastre 1', type: 'Bomba', location: 'Cámara de máquinas, babor', rpm: 1480, kw: 30, iso: 1, notes: '' };
  await DB.put('machines', m);
  const pts = [
    { id: uid(), machineId: m.id, created: nowIso(), name: 'Motor lado acoplamiento', code: 'M1', cfg: { mode: 1, navg: 2, win: 1 }, orient: { z: 'V', x: 'H' } },
    { id: uid(), machineId: m.id, created: nowIso(), name: 'Motor lado libre', code: 'M2', cfg: { mode: 1, navg: 2, win: 1 }, orient: { z: 'V', x: 'H' } }];
  for (const pt of pts) await DB.put('points', pt);
  const fs = MODES[1];
  for (let k = 0; k < 6; k++) {
    for (const [j, pt] of pts.entries()) {
      const rpm = 1476 + Math.round(Math.random()*6), f1 = rpm/60, unb = 0.02 + 0.012*k*(j ? 0.5 : 1);
      const when = new Date(Date.now() - (5 - k)*30*864e5 - j*36e5).toISOString();
      const meas = { id: uid(), pointId: pt.id, when, rpm, load: 70 + Math.round(Math.random()*15), note: k === 5 ? 'Ruido algo mayor' : '', demo: true,
        orient: pt.orient, axisMap: orientMap(pt.orient), cfg: { mode: 1, fs, navg: 2, win: 1 }, quiet: true, unit: 'cg', sensor: { name: '8531 demo', fw: 'sintético' },
        dirs: { H: [synth(fs, f1, unb, 0.008, 11+k), synth(fs, f1, unb, 0.008, 21+k)], V: [synth(fs, f1, unb*0.6, 0.006, 31+k), synth(fs, f1, unb*0.6, 0.006, 41+k)], A: [synth(fs, f1, 0.008, 0.012 + 0.004*k, 51+k), synth(fs, f1, 0.008, 0.012 + 0.004*k, 61+k)] } };
      meas.overall = overallOf(meas);
      await DB.put('measurements', meas, false);
    }
  }
  const m2 = { id: uid(), plantId: p.id, created: nowIso(), name: 'Ventilador sala de máquinas', type: 'Ventilador', location: 'Cubierta 2, popa', rpm: 1450, kw: 11, iso: 0, notes: '' };
  await DB.put('machines', m2);
  const p3 = { id: uid(), machineId: m2.id, created: nowIso(), name: 'Motor lado libre', code: 'V1', cfg: { mode: 1, navg: 1, win: 1 }, orient: { z: 'V', x: 'H' } };
  await DB.put('points', p3);
  const rt = { id: uid(), plantId: p.id, created: nowIso(), name: 'Cámara de máquinas · mensual', period: 30, description: 'Medir con las máquinas en servicio normal, tras al menos 15 min funcionando.', points: [pts[0].id, pts[1].id, p3.id] };
  await DB.put('routes', rt);
  await DB.put('rounds', { id: uid(), routeId: rt.id, started: new Date(Date.now() - 34*864e5).toISOString(), finished: new Date(Date.now() - 34*864e5 + 3600e3).toISOString(),
    items: { [pts[0].id]: { status: 'done', when: nowIso() }, [pts[1].id]: { status: 'done', when: nowIso() }, [p3.id]: { status: 'skip', reason: 'Máquina parada', when: nowIso() } } });
  log('Datos de ejemplo creados', 'ok');
}

/* =====================================================================
   Explorador GATT
   ===================================================================== */
const short = u => (u.startsWith('b614') || u.startsWith('0000')) ? u.slice(4,8) : u;
const needConn = () => { if (!Sensor.connected()) { log('Conecta primero el sensor', 'warn'); return true; } return false; };
async function allChars() {
  const out = [];
  for (const sv of await Sensor.q(() => Sensor.server.getPrimaryServices())) { try { out.push(...await Sensor.q(() => sv.getCharacteristics())); } catch (e) {} }
  return out;
}
async function listSvcs() {
  if (needConn()) return;
  const lines = (await allChars()).map(ch => { const p = ch.properties; return `${short(ch.service.uuid)}/${short(ch.uuid)}  [${[p.read && 'R', (p.write || p.writeWithoutResponse) && 'W', p.notify && 'N', p.indicate && 'I'].filter(Boolean).join('/')}]`; });
  for (const l of lines.reverse()) log(l);
  log('Servicios y características:', 'ok');
}
async function dumpAll() {
  if (needConn()) return;
  const lines = [];
  for (const ch of await allChars()) { if (!ch.properties.read) continue; try { const dv = await Sensor.q(() => ch.readValue()); lines.push(`${short(ch.uuid)} [${dv.byteLength} B]: ${hex(dv)}`); } catch (e) { lines.push(`${short(ch.uuid)}: ${e.message}`); } }
  for (const l of lines.reverse()) log(l);
  log('Volcado:', 'ok');
}
async function findChar(k) { k = k.trim().toLowerCase(); for (const ch of await allChars()) if (short(ch.uuid) === k || ch.uuid === k) return ch; throw new Error('No encontrada: ' + k); }
function parseHex(t) { const b = t.replace(/0x/gi,'').replace(/[^0-9a-f]/gi,''); if (b.length % 2) throw new Error('Hex impar'); return new Uint8Array((b.match(/../g) || []).map(x => parseInt(x,16))); }
async function xOp(write, read) {
  if (needConn()) return;
  try {
    const ch = await findChar($('#xCh').value);
    if (write) { const b = parseHex($('#xHex').value); await Sensor.q(() => Sensor._w(ch, b)); log(`ESCRIBIR ${short(ch.uuid)}: ${hex(new DataView(b.buffer))}`, 'ok'); if (read) await sleep(200); }
    if (read) { const dv = await Sensor.q(() => ch.readValue()); log(`LEER ${short(ch.uuid)} [${dv.byteLength} B]: ${hex(dv)}`); }
  } catch (e) { log(e.message, 'err'); }
}

/* =====================================================================
   Arranque
   ===================================================================== */
(async function init() {
  if (!navigator.bluetooth) view.insertAdjacentHTML('beforebegin', '<div class="warnbox" style="max-width:1168px;margin:12px auto 0">Este navegador no tiene Web Bluetooth: puedes revisar datos, pero para medir usa Chrome o Edge (Android, Windows, macOS) abriendo la página por https o desde localhost.</div>');
  try { await DB.open(); } catch (e) { view.innerHTML = `<div class="empty">No se pudo abrir la base de datos local: ${esc(e.message)}</div>`; return; }
  try { if (navigator.storage?.persist) await navigator.storage.persist(); } catch (e) {}
  if (!pref.get('mode', null)) pref.set('mode', defaultMode());   // se decide una vez y se guarda
  applyMode(); setChip(); route();
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(e => log('Modo sin conexión no disponible: ' + e.message, 'warn'));
})();
</script>
